<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trioditis</title>
    <!--
      Stand-in for the web app until apps/desktop's build lands in the bundle (see
      deploy/docker/web.Dockerfile). It says whether the server is up, and finishes setup:
      the installer's link (/setup#token=…) or an invite link (/invite#token=…) opens a
      form that creates the account. The token stays in the fragment, so it never reaches
      the server's logs.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #16181d;
        --muted: #5c6370;
        --accent: #0284c7;
        --border: #e3e6eb;
        --bad: #c0362c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --card: #171a21;
          --text: #e8eaee;
          --muted: #9aa1ad;
          --border: #2a2f39;
          --bad: #f07167;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 16px;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { margin: 0 0 16px; color: var(--muted); }
      label { display: block; font-size: 13px; margin: 12px 0 4px; }
      input {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      button {
        margin-top: 18px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .status { display: flex; gap: 8px; align-items: center; color: var(--muted); }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
      .dot.up { background: #22a06b; }
      .dot.down { background: var(--bad); }
      .error { color: var(--bad); margin-top: 12px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Trioditis</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="status">Checking the server…</span></div>

      <section id="home">
        <p style="margin-top: 16px">
          The server is installed. The full app isn't in this build yet. To create the admin account, open the setup
          link the installer printed.
        </p>
      </section>

      <form id="signup" hidden>
        <p id="intro" style="margin-top: 16px"></p>
        <label for="name">Name</label>
        <input id="name" autocomplete="name" required />
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
        <label for="password">Password (12 or more characters)</label>
        <input id="password" type="password" autocomplete="new-password" minlength="12" required />
        <button id="submit" type="submit">Create account</button>
        <div class="error" id="error" hidden></div>
      </form>

      <section id="done" hidden>
        <p style="margin-top: 16px" id="doneText"></p>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id)
      const token = new URLSearchParams(location.hash.slice(1)).get('token')
      const setup = location.pathname.startsWith('/setup')
      const invite = location.pathname.startsWith('/invite')

      fetch('/convex/version')
        .then((response) => {
          $('dot').className = response.ok ? 'dot up' : 'dot down'
          $('status').textContent = response.ok ? 'Server is up' : 'The backend isn’t answering yet'
        })
        .catch(() => {
          $('dot').className = 'dot down'
          $('status').textContent = 'The backend isn’t answering yet'
        })

      if ((setup || invite) && token) {
        $('home').hidden = true
        $('signup').hidden = false
        $('intro').textContent = setup
          ? 'Create the admin account for this server. This link works once.'
          : 'You’ve been invited to this Trioditis server. Use the email address the invitation was sent to.'
      }

      $('signup').addEventListener('submit', async (event) => {
        event.preventDefault()
        $('submit').disabled = true
        $('error').hidden = true
        try {
          const response = await fetch('/api/auth/sign-up/email', {
            method: 'POST',
            credentials: 'include',
            headers: { 'content-type': 'application/json', 'x-trioditis-invite': token },
            body: JSON.stringify({ name: $('name').value, email: $('email').value, password: $('password').value }),
          })
          if (!response.ok) {
            const body = await response.json().catch(() => ({}))
            throw new Error(body.message || 'The account couldn’t be created.')
          }
          history.replaceState(null, '', '/')
          $('signup').hidden = true
          $('done').hidden = false
          $('doneText').textContent = 'Your account is ready. The full app arrives with the next update of this server.'
        } catch (error) {
          $('error').textContent = error.message
          $('error').hidden = false
          $('submit').disabled = false
        }
      })
    </script>
  </body>
</html>
