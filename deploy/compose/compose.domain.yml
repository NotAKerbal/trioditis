# Domain mode: Caddy serves the domain on 80 and 443 and gets certificates with ACME.
services:
  caddy:
    ports: !override
      - 80:80
      - 443:443
      - 443:443/udp
  # The domain points at this machine, so the backend reaches it here rather than looping
  # through the router, which many don't do.
  backend:
    extra_hosts:
      - ${PUBLIC_HOST:?}:host-gateway
