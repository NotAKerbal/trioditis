<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossroads Top Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crossroads-core.css">
<style>
  :root { --list-w: 330px; }
  .topbar { height: 54px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 14px; border-bottom: 1px solid var(--line); background: var(--rail); }
  .topbar .brand { display: flex; align-items: center; gap: 9px; width: calc(var(--list-w) - 14px); }
  .topbar .brand b { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .topbar .sp { flex: 1; }
  .vt { height: 34px; padding: 0 11px; border-radius: 9px; color: var(--dim); font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .vt:hover { background: #e9ecf0; color: var(--text); }
  .vt.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(15,23,42,.06); }
  .vt .n { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .vt.on .n { color: var(--accent); }
  .nets { display: flex; gap: 3px; padding: 3px; border-radius: 11px; background: #e9ecf0; margin-right: 6px; }
  .nb { position: relative; width: 34px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; opacity: .55; filter: saturate(.6); }
  .nb:hover { opacity: 1; filter: none; background: #fff; }
  .nets.any .nb { opacity: .35; }
  .nets.any .nb.on, .nets .nb.on { opacity: 1; filter: none; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.12); }
  .nets:not(.any) .nb { opacity: 1; filter: none; }
  .nb .c { position: absolute; top: -5px; right: -4px; z-index: 1; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 7px; background: var(--accent); color: #fff; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #e9ecf0; }
  .nb .wd { position: absolute; bottom: 1px; right: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px #e9ecf0; }
  .lbtn { height: 34px; padding: 0 10px; border-radius: 9px; color: var(--dim); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .lbtn:hover { background: #e9ecf0; color: var(--text); }
  .lbtn.on { background: #fff; color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .lbtn .lbdot { width: 8px; height: 8px; border-radius: 50%; }
  .topbar .iconbtn:hover { background: #e9ecf0; }
  .lh { padding-top: 14px; }
</style>
</head>
<body>
<div class="backbar"><a class="back" href="index.html">← All prototypes</a></div>
<div id="wrap"><div id="stage" tabindex="0">
  <header class="topbar">
    <div class="brand"><span class="logo">T</span><b>Trioditis</b></div>
    <nav id="views" style="display:flex;gap:2px"></nav>
    <span class="sp"></span>
    <div class="nets" id="nets"></div>
    <button class="lbtn" id="lbtn" data-menu="labels" data-align="right"></button>
    <button class="iconbtn" data-act="new" title="New message"></button>
    <button class="meav" data-menu="account" data-align="right" title="Account" style="margin-left:4px">IC</button>
  </header>
  <div class="main">
    <section class="list">
      <div class="lh">
        <label class="search" id="searchbox"><input id="q" placeholder="Search chats and people" autocomplete="off"></label>
        <div id="fchips"></div>
      </div>
      <div class="rows" id="rows"></div>
    </section>
    <section class="chat" id="chat"></section>
    <aside class="det" id="det"></aside>
  </div>
  <div class="via-menu" id="viamenu" hidden></div>
  <div class="menu" id="menu" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div></div>

<script src="shared.js"></script>
<script>
// Iteration 3: no sidebar. Views, networks and labels live in one bar across the top.
const TOP_VIEWS = ['inbox', 'unread', 'mentions', 'pinned', 'requests', 'agents', 'archived'];
const NAV = {
  healthBanner: true,
  render() {
    $('views').innerHTML = TOP_VIEWS.map((id) => {
      const v = viewOf(id);
      const n = viewCount(v);
      return `<button class="vt${filt.view === id ? ' on' : ''}" data-view="${id}">${v.name}${n ? `<span class="n">${n}</span>` : ''}</button>`;
    }).join('');
    $('nets').classList.toggle('any', !!filt.net);
    $('nets').innerHTML = NET_KEYS.map((k) => {
      const n = netCount(k);
      const tip = `${filt.net === k ? 'Showing only ' : 'Show only '}${NETS[k].name}${NETS[k].health ? ` · ${NETS[k].health}` : ''}${NETS[k].maturity === 'beta' || NETS[k].maturity === 'experimental' ? ` · ${NETS[k].maturity}` : ''}`;
      return `<button class="nb${filt.net === k ? ' on' : ''}" data-net="${k}" title="${tip}">${netBadge(k, 20)}${n ? `<span class="c">${n}</span>` : ''}${NETS[k].health ? '<span class="wd"></span>' : ''}</button>`;
    }).join('');
    $('lbtn').classList.toggle('on', !!filt.label);
    $('lbtn').innerHTML = filt.label
      ? `<span class="lbdot" style="background:${LABELS[filt.label]}"></span>${filt.label} ${icon('down', 14)}`
      : `${icon('tag', 16)} Labels ${icon('down', 14)}`;
    $('fchips').innerHTML = activeFiltersHTML();
  },
  menus: {
    labels() {
      return `<div class="mh">Only this label</div>${Object.keys(LABELS).map((l) => `<button class="mi${filt.label === l ? ' on' : ''}" data-label="${l}"><span class="dot" style="background:${LABELS[l]}"></span>${l}<span class="c">${labelCount(l) || ''}</span></button>`).join('')}
        <div class="sep"></div><button class="mi" data-act="labels">${icon('pencil', 15)} Edit labels</button>`;
    },
  },
};
</script>
<script src="crossroads-core.js"></script>
<script>
document.querySelector('[data-act="new"]').innerHTML = icon('pencil', 17);
</script>
</body>
</html>
