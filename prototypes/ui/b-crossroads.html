<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trioditis Crossroads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --rail: #f4f5f7; --soft: #f8f9fb; --line: #e6e8ed; --line2: #d9dde4;
    --text: #0f172a; --dim: #475569; --faint: #94a3b8;
    --accent: #0284c7; --accent-2: #0ea5e9; --accent-soft: #e0f2fe; --accent-ink: #075985;
    --warn: #d97706; --ok: #16a34a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif; }
  body { background: #e9ecf1; }
  @media (min-width: 1330px) { body { padding: 16px 24px 24px; } }
  .back { display: inline-block; max-width: 1280px; margin: 0 auto; padding: 8px 4px; font: 500 13px/1 system-ui, sans-serif; color: #475569; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .backbar { max-width: 1280px; margin: 0 auto; }
  #wrap { position: relative; width: 100%; max-width: 1280px; margin: 0 auto; overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 1px rgba(15,23,42,.08); }
  #stage { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; transform-origin: 0 0; background: var(--bg); color: var(--text);
    font-size: 14px; display: flex; overflow: hidden; outline: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .i { flex: none; display: block; }
  ::-webkit-scrollbar { width: 0; }

  .av { position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 600; flex: none; }
  .av.grp { border-radius: 30%; }
  .netb { position: absolute; right: -3px; bottom: -3px; width: 16px; height: 16px; border-radius: 5px; font-size: 9.5px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #fff; }
  .netb.inline { position: static; box-shadow: none; display: inline-flex; border-radius: 4px; }

  /* rail */
  .rail { width: 204px; flex: none; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 0 6px 14px; }
  .logo { width: 26px; height: 26px; border-radius: 7px; background: #0284c7; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .brand b { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .brand .new { margin-left: auto; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--dim); background: #fff; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(15,23,42,.06); }
  .brand .new:hover { color: var(--accent); }
  .grp-h { font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; padding: 14px 8px 5px; }
  .ri { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 8px; border-radius: 8px; color: var(--dim); font-weight: 500; text-align: left; }
  .ri:hover { background: #eaecf0; color: var(--text); }
  .ri.on { background: #fff; color: var(--text); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(15,23,42,.05); }
  .ri .c { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .ri.on .c { color: var(--accent); font-weight: 600; }
  .ri .mat { font-size: 9.5px; color: var(--faint); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; line-height: 14px; }
  .ri .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .ri .warn { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); margin-left: -4px; }
  .rail .bottom { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }

  /* list */
  .list { width: 320px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .lh { padding: 16px 16px 10px; }
  .lh h2 { margin: 0 0 12px; font-size: 18px; font-weight: 700; letter-spacing: -.015em; display: flex; align-items: center; gap: 8px; }
  .lh h2 .s { font-size: 12.5px; font-weight: 500; color: var(--faint); }
  .search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 11px; border-radius: 9px; background: var(--soft); border: 1px solid var(--line); color: var(--faint); }
  .search:focus-within { border-color: var(--accent-2); background: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
  .search input { flex: 1; border: 0; outline: none; background: none; font: inherit; color: var(--text); min-width: 0; }
  .chips { display: flex; gap: 6px; margin-top: 10px; }
  .chip { height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12.5px; font-weight: 500; color: var(--dim); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 5px; }
  .chip:hover { border-color: var(--line2); color: var(--text); }
  .chip.on { background: var(--text); border-color: var(--text); color: #fff; }
  .rows { flex: 1; overflow-y: auto; padding: 2px 8px 10px; }
  .row { display: flex; gap: 11px; align-items: center; padding: 9px 9px; border-radius: 10px; cursor: pointer; }
  .row:hover { background: var(--soft); }
  .row.sel { background: var(--accent-soft); }
  .row .mid { flex: 1; min-width: 0; }
  .row .l1 { display: flex; align-items: center; gap: 5px; }
  .row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.read .nm { font-weight: 500; }
  .row .tm { margin-left: auto; font-size: 12px; color: var(--faint); flex: none; }
  .row .l2 { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .row .pv { flex: 1; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .row.read .pv { color: var(--faint); }
  .row .pv.need { color: var(--accent); font-weight: 500; }
  .pill { min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .pill.muted { background: #e2e8f0; color: var(--dim); }
  .row .ic { color: var(--faint); }
  .none { padding: 50px 20px; text-align: center; color: var(--faint); }

  /* chat */
  .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--soft); }
  .ch { height: 64px; display: flex; align-items: center; gap: 11px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); background: #fff; flex: none; }
  .ch .t { font-weight: 700; font-size: 15px; }
  .ch .s { font-size: 12.5px; color: var(--faint); display: flex; align-items: center; gap: 5px; margin-top: 1px; }
  .ch .tools { margin-left: auto; display: flex; gap: 2px; }
  .hb { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--dim); }
  .hb:hover { background: var(--soft); color: var(--text); }
  .hb.on { background: var(--accent-soft); color: var(--accent); }
  .msgs { flex: 1; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; }
  .day { align-self: center; font-size: 11.5px; color: var(--faint); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 2px 10px; margin: 0 0 12px; }
  .m { position: relative; max-width: 78%; display: flex; flex-direction: column; margin-bottom: 2px; }
  .m.them { align-self: flex-start; }
  .m.me { align-self: flex-end; align-items: flex-end; }
  .m .who { font-size: 12px; font-weight: 600; margin: 10px 0 3px 12px; }
  .bub { padding: 8px 12px; border-radius: 18px; line-height: 1.42; background: #fff; box-shadow: 0 0 0 1px var(--line); }
  .m.me .bub { background: var(--accent); color: #fff; box-shadow: none; }
  .quote { font-size: 12.5px; border-left: 3px solid currentColor; padding: 1px 0 1px 8px; margin-bottom: 4px; opacity: .8; }
  .m .meta { font-size: 11px; color: var(--faint); margin: 3px 10px 8px; display: flex; gap: 5px; align-items: center; }
  .m .meta .by { color: var(--accent); display: inline-flex; gap: 3px; align-items: center; font-weight: 500; }
  .st { display: inline-flex; align-items: center; gap: 4px; }
  .st.read { color: var(--accent); }
  .st.unknown { color: var(--warn); font-weight: 600; }
  .fix { color: var(--warn); text-decoration: underline; text-underline-offset: 2px; font-size: 11px; font-weight: 600; }
  .media { width: 220px; height: 150px; border-radius: 16px; background: linear-gradient(135deg, #cbd5e1, #94a3b8); display: flex; align-items: center; justify-content: center; color: #fff; }
  .rx { display: flex; gap: 4px; margin: -6px 8px 0; z-index: 1; }
  .rx button { background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 0 7px; height: 22px; font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }
  .rx button.mine { border-color: var(--accent-2); background: var(--accent-soft); color: var(--accent-ink); }
  .hov { position: absolute; top: -16px; display: none; background: #fff; border-radius: 10px; box-shadow: 0 0 0 1px var(--line), 0 6px 16px rgba(15,23,42,.1); padding: 3px; gap: 1px; z-index: 2; }
  .m.them .hov { right: -10px; }
  .m.me .hov { left: -10px; }
  .m:hover .hov { display: flex; }
  .hov button { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--dim); }
  .hov button:hover { background: var(--soft); }

  /* approval card */
  .card { align-self: stretch; margin: 6px 0 12px; background: #fff; border-radius: 16px; box-shadow: 0 0 0 1px #bae6fd, 0 6px 20px rgba(2,132,199,.08); padding: 14px 16px; }
  .card .h { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: .03em; }
  .card .to { color: var(--dim); font-size: 13px; margin-top: 9px; display: flex; gap: 6px; align-items: center; }
  .card .q { margin-top: 7px; padding: 10px 12px; background: var(--soft); border-radius: 10px; line-height: 1.45; }
  .card textarea { width: 100%; margin-top: 7px; padding: 10px 12px; background: #fff; border-radius: 10px; border: 1px solid var(--accent-2); font: inherit; resize: none; outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .card .btns { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .btn { height: 32px; padding: 0 13px; border-radius: 9px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .btn.pri { background: var(--accent); color: #fff; }
  .btn.pri:hover { background: #0369a1; }
  .btn.sec { background: #fff; box-shadow: 0 0 0 1px var(--line2); }
  .btn.sec:hover { background: var(--soft); }
  .btn.ghost { color: var(--dim); }
  .card.done { box-shadow: 0 0 0 1px var(--line); }
  .card.done .h { color: var(--dim); }

  /* composer */
  .comp { margin: 4px 14px 14px; background: #fff; border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(15,23,42,.04); flex: none; }
  .comp:focus-within { box-shadow: 0 0 0 1px var(--accent-2), 0 0 0 4px var(--accent-soft); }
  .comp .rq { display: flex; align-items: center; gap: 8px; margin: 8px 8px 0; padding: 7px 10px; background: var(--soft); border-radius: 9px; font-size: 12.5px; color: var(--dim); }
  .comp .rq b { color: var(--text); font-weight: 600; }
  .comp .rq span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comp .row1 { display: flex; align-items: flex-end; gap: 2px; padding: 6px; }
  .comp textarea { flex: 1; border: 0; outline: none; resize: none; font: inherit; padding: 8px 6px; height: 38px; color: var(--text); background: none; }
  .comp textarea::placeholder { color: var(--faint); }
  .cb { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: var(--faint); flex: none; }
  .cb:hover { background: var(--soft); color: var(--text); }
  .cb.send { background: var(--accent); color: #fff; }
  .cb.send:hover { background: #0369a1; }
  .comp .row2 { display: flex; align-items: center; gap: 8px; padding: 0 12px 9px; font-size: 12px; color: var(--faint); }
  .via { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 6px; border-radius: 7px; background: var(--soft); color: var(--dim); font-weight: 500; }
  .via:hover { background: #eef1f5; color: var(--text); }
  .via.static { cursor: default; background: none; padding: 0; }
  .via-menu { position: absolute; z-index: 5; width: 230px; background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px var(--line), 0 14px 36px rgba(15,23,42,.16); padding: 5px; }
  .via-menu[hidden] { display: none; }
  .via-menu .h { font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .05em; text-transform: uppercase; padding: 7px 9px 4px; }
  .via-menu button { display: flex; align-items: center; gap: 9px; width: 100%; height: 34px; padding: 0 9px; border-radius: 8px; text-align: left; }
  .via-menu button:hover { background: var(--soft); }
  .via-menu .ck { margin-left: auto; color: var(--accent); }
  .ai-link { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; color: var(--accent); font-weight: 600; }
  .ai-link:hover { color: var(--accent-ink); }

  /* details */
  .det { width: 292px; flex: none; border-left: 1px solid var(--line); overflow-y: auto; background: #fff; }
  .det[hidden] { display: none; }
  .det .top { padding: 24px 20px 18px; text-align: center; border-bottom: 1px solid var(--line); }
  .det .top .nm { font-weight: 700; font-size: 17px; margin-top: 10px; }
  .det .top .sub { color: var(--faint); font-size: 12.5px; margin-top: 2px; }
  .det .qa { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  .qa button { width: 62px; padding: 8px 0 6px; border-radius: 10px; background: var(--soft); color: var(--dim); font-size: 11.5px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .qa button:hover { background: #eef1f5; color: var(--text); }
  .qa button.on { background: var(--accent-soft); color: var(--accent-ink); }
  .dsec { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .dsec h4 { margin: 0 0 10px; font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .seg { display: flex; background: var(--soft); border-radius: 9px; padding: 3px; box-shadow: inset 0 0 0 1px var(--line); }
  .seg button { flex: 1; height: 28px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--dim); }
  .seg button.on { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(15,23,42,.12), 0 0 0 1px var(--line); font-weight: 600; }
  .hint { font-size: 12px; color: var(--faint); margin-top: 8px; line-height: 1.4; display: flex; gap: 6px; }
  .lchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .lchip { height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--line2); color: var(--faint); }
  .lchip i { width: 7px; height: 7px; border-radius: 50%; display: block; }
  .lchip.on { border-style: solid; color: var(--text); }
  .nrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .nrow .x { flex: 1; min-width: 0; }
  .nrow .x div:first-child { font-weight: 500; }
  .nrow .x div:last-child { font-size: 12px; color: var(--faint); }
  .tag { font-size: 11px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; }
  .member { display: flex; align-items: center; gap: 9px; padding: 4px 0; font-size: 13px; }
  .scope { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 13px; }
  .scope .ok { color: var(--ok); }
  .scope .no { color: var(--faint); }
  .sealed { padding: 16px 20px 22px; font-size: 12px; color: var(--faint); display: flex; gap: 8px; line-height: 1.45; }

  .toast { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; border-radius: 11px; height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-weight: 500; box-shadow: 0 12px 30px rgba(15,23,42,.25); z-index: 9; white-space: nowrap; }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<div class="backbar"><a class="back" href="index.html">← All prototypes</a></div>
<div id="wrap"><div id="stage" tabindex="0">
  <nav class="rail" id="rail"></nav>
  <section class="list">
    <div class="lh">
      <h2 id="ltitle"></h2>
      <label class="search" id="searchbox"><input id="q" placeholder="Search chats and people" autocomplete="off"></label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="rows" id="rows"></div>
  </section>
  <section class="chat" id="chat"></section>
  <aside class="det" id="det"></aside>
  <div class="via-menu" id="viamenu" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div></div>

<script src="shared.js"></script>
<script>
const chats = makeChats();
const $ = (id) => document.getElementById(id);
const stage = $('stage');
fitStage($('wrap'), stage, 1280, 800);
$('searchbox').insertAdjacentHTML('afterbegin', icon('search', 16));

chats.forEach((c) => {
  c.via = c.net;
  c.notify = c.muted ? 'off' : c.group ? 'mentions' : 'all';
  c.agentAccess = c.labels && (c.labels.includes('Family') || c.labels.includes('Work')) ? 'draft' : 'none';
  c.mine = {};
});

const VIEWS = [
  { id: 'inbox', name: 'Inbox', ic: 'inbox', test: (c) => !c.archived && !c.request },
  { id: 'unread', name: 'Unread', ic: 'eye', test: (c) => !c.archived && c.unread > 0 && !c.muted },
  { id: 'mentions', name: 'Mentions', ic: 'at', test: (c) => c.mention },
  { id: 'pinned', name: 'Pinned', ic: 'pin', test: (c) => c.pinned },
  { id: 'requests', name: 'Requests', ic: 'user', test: (c) => c.request },
  { id: 'agents', name: 'Agents', ic: 'sparkle', test: (c) => c.agent },
  { id: 'archived', name: 'Archived', ic: 'archive', test: (c) => c.archived },
];
const CHIPS = [
  { id: 'all', name: 'All' },
  { id: 'unread', name: 'Unread', test: (c) => c.unread > 0 },
  { id: 'people', name: 'People', test: (c) => !c.group && !c.agent },
  { id: 'groups', name: 'Groups', test: (c) => c.group },
];

let view = { kind: 'view', id: 'inbox' };
let chip = 'all';
let sel = 'mom';
let detOpen = true;
let replyTo = null;

const byId = (id) => chats.find((c) => c.id === id);
const current = () => byId(sel);

function baseTest() {
  if (view.kind === 'view') return VIEWS.find((v) => v.id === view.id).test;
  if (view.kind === 'net') return (c) => c.net === view.id && !c.archived;
  return (c) => (c.labels || []).includes(view.id) && !c.archived;
}
function visible() {
  const q = $('q').value.trim().toLowerCase();
  const ch = CHIPS.find((x) => x.id === chip);
  return chats
    .filter(baseTest())
    .filter((c) => !ch.test || ch.test(c))
    .filter((c) => !q || c.name.toLowerCase().includes(q) || c.msgs.some((m) => (m.text || '').toLowerCase().includes(q)))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
}
function countFor(test) {
  return chats.filter((c) => test(c) && c.unread && !c.muted).length || '';
}

function renderRail() {
  const vi = (v) => `<button class="ri${view.kind === 'view' && view.id === v.id ? ' on' : ''}" data-view="${v.id}">${icon(v.ic, 16)}${v.name}<span class="c">${v.id === 'requests' ? chats.filter(v.test).length || '' : v.id === 'archived' ? '' : countFor(v.test)}</span></button>`;
  const nets = Object.keys(NETS).filter((k) => k !== 'ai').map((k) => {
    const n = NETS[k];
    const mat = n.maturity === 'beta' ? '<span class="mat">beta</span>' : n.maturity === 'experimental' ? '<span class="mat">exp</span>' : '';
    return `<button class="ri${view.kind === 'net' && view.id === k ? ' on' : ''}" data-net="${k}" title="${n.health ? `${n.name}: ${n.health}` : `${n.name}: connected`}">${netBadge(k, 16)}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n.name}</span>${n.health ? '<span class="warn"></span>' : ''}${mat}<span class="c">${countFor((c) => c.net === k)}</span></button>`;
  }).join('');
  const labels = Object.keys(LABELS).map((l) => `<button class="ri${view.kind === 'label' && view.id === l ? ' on' : ''}" data-label="${l}"><span class="dot" style="background:${LABELS[l]}"></span>${l}<span class="c">${countFor((c) => (c.labels || []).includes(l))}</span></button>`).join('');
  $('rail').innerHTML = `
    <div class="brand"><span class="logo">T</span><b>Trioditis</b><button class="new" title="New message" data-act="new">${icon('pencil', 16)}</button></div>
    ${VIEWS.map(vi).join('')}
    <div class="grp-h">Networks</div>${nets}
    <div class="grp-h">Labels</div>${labels}
    <div class="bottom">
      <button class="ri" data-act="connect">${icon('plus', 16)}Connect a network</button>
      <button class="ri" data-act="settings">${icon('sliders', 16)}Settings</button>
    </div>`;
}

function title() {
  if (view.kind === 'view') return VIEWS.find((v) => v.id === view.id).name;
  if (view.kind === 'net') return `${netBadge(view.id, 20)} ${NETS[view.id].name}${NETS[view.id].health ? `<span class="s" style="color:var(--warn)">${NETS[view.id].health}</span>` : ''}`;
  return `<span style="width:10px;height:10px;border-radius:50%;background:${LABELS[view.id]}"></span>${view.id}`;
}

function renderList() {
  $('ltitle').innerHTML = title();
  $('chips').innerHTML = CHIPS.map((c) => `<button class="chip${chip === c.id ? ' on' : ''}" data-chip="${c.id}">${c.name}</button>`).join('');
  const list = visible();
  $('rows').innerHTML = list.map((c) => {
    const pending = c.msgs.some((m) => m.kind === 'approval' && m.approval.state === 'pending');
    return `<div class="row${c.id === sel ? ' sel' : ''}${c.unread ? '' : ' read'}" data-id="${c.id}">${avatar(c, 42)}
      <div class="mid"><div class="l1"><span class="nm">${esc(c.name)}</span>${c.pinned ? `<span class="ic">${icon('pin', 12)}</span>` : ''}${c.muted ? `<span class="ic">${icon('mute', 12)}</span>` : ''}<span class="tm">${c.time}</span></div>
      <div class="l2"><span class="pv${pending ? ' need' : ''}">${esc(preview(c))}</span>${c.mention ? '<span class="pill">@</span>' : c.unread ? `<span class="pill${c.muted ? ' muted' : ''}">${c.unread}</span>` : ''}</div></div></div>`;
  }).join('') || `<div class="none">No chats match.</div>`;
}

function msgHTML(c, m, i) {
  if (m.kind === 'approval') return approvalHTML(c, m, i);
  const prev = c.msgs[i - 1];
  const side = m.from === 'me' ? 'me' : 'them';
  const who = c.group && side === 'them' && (!prev || prev.from !== m.from) ? `<div class="who" style="color:hsl(${hue(m.from)} 55% 40%)">${esc(m.from)}</div>` : '';
  const quote = m.quote ? `<div class="quote">${esc(m.quote)}</div>` : '';
  const body = m.media ? `<div class="media">${icon('eye', 22)}</div>` : `<div class="bub">${quote}${esc(m.text)}</div>`;
  const rx = Object.entries(m.reactions || {}).filter(([, n]) => n > 0);
  const rxHTML = rx.length ? `<div class="rx">${rx.map(([e, n]) => `<button class="${m.mine && m.mine[e] ? 'mine' : ''}" data-react="${e}" data-i="${i}">${e} ${n}</button>`).join('')}</div>` : '';
  const hov = c.agent ? '' : `<div class="hov">${['❤️', '😂', '👍'].map((e) => `<button data-react="${e}" data-i="${i}">${e}</button>`).join('')}<button data-reply="${i}" title="Reply">${icon('reply', 15)}</button></div>`;
  const fix = m.status === 'unknown' ? `<button class="fix" data-fix="${i}">Check again</button>` : '';
  const by = m.by ? `<span class="by">${icon('sparkle', 11)} ${m.by}</span>` : '';
  return `<div class="m ${side}">${who}${body}${hov}${rxHTML}<div class="meta">${by}${m.t}${side === 'me' ? statusHTML(m.status) : ''}${fix}</div></div>`;
}

function approvalHTML(c, m, i) {
  const a = m.approval;
  const to = byId(a.to);
  const target = `<div class="to">Reply to ${avatar(to, 20, false)} <b style="color:var(--text)">${esc(to.name)}</b> on ${netBadge(to.net)} ${NETS[to.net].name}</div>`;
  if (a.state === 'sent') return `<div class="card done"><div class="h">${icon('check', 14)} APPROVED AND SENT</div>${target}<div class="q">${esc(a.text)}</div></div>`;
  if (a.state === 'rejected') return `<div class="card done"><div class="h">${icon('x', 14)} REJECTED</div>${target}</div>`;
  if (a.state === 'revoked') return `<div class="card done"><div class="h">${icon('lock', 14)} DISCARDED</div>${target}<div class="hint">${icon('info', 14)}<span>Dots no longer has draft access to ${esc(to.name)}'s chat.</span></div></div>`;
  const editing = a.state === 'editing';
  return `<div class="card"><div class="h">${icon('sparkle', 14)} DOTS WANTS TO SEND</div>${target}
    ${editing ? `<textarea id="aedit" rows="2">${esc(a.edit ?? a.text)}</textarea>` : `<div class="q">${esc(a.text)}</div>`}
    <div class="btns"><button class="btn pri" data-ap="approve" data-i="${i}">${icon('check', 15)} ${editing ? 'Send edited' : 'Approve & send'}</button>
    ${editing ? '' : `<button class="btn sec" data-ap="edit" data-i="${i}">${icon('pencil', 14)} Edit</button>`}<button class="btn ghost" data-ap="reject" data-i="${i}">Reject</button></div></div>`;
}

function renderChat() {
  const focus = captureFocus();
  const c = current();
  if (!c) { $('chat').innerHTML = `<div class="none" style="margin:auto">Pick a chat.</div>`; return; }
  const net = NETS[c.net];
  const sub = c.agent ? `${icon('sparkle', 12)} Agent · connected via MCP` : `${netBadge(c.net, 14)} ${net.name}${c.group ? ' · 4 members' : ''}${c.alt ? ` · also on ${c.alt.map((k) => NETS[k].name).join(', ')}` : ''}`;
  const nets = [c.net, ...(c.alt || [])];
  const via = c.agent
    ? `<span class="via static">${icon('sparkle', 12)} Agent thread</span>`
    : nets.length > 1
      ? `<button class="via" data-act="via">Send via ${netBadge(c.via, 14)} ${NETS[c.via].name} ${icon('down', 13)}</button>`
      : `<span class="via static">${netBadge(c.via, 14)} ${NETS[c.via].name}</span>`;
  const rq = replyTo != null && c.msgs[replyTo] ? `<div class="rq">${icon('reply', 14)}<span>Replying to <b>${esc(c.msgs[replyTo].from === 'me' ? 'yourself' : c.msgs[replyTo].from === 'them' ? c.name : c.msgs[replyTo].from)}</b>: ${esc(c.msgs[replyTo].text)}</span><button class="cb" style="width:22px;height:22px" data-act="unreply">${icon('x', 13)}</button></div>` : '';
  $('chat').innerHTML = `
    <div class="ch">${avatar(c, 38)}<div><div class="t">${esc(c.name)}</div><div class="s">${sub}</div></div>
      <div class="tools"><button class="hb" title="Search in chat">${icon('search', 18)}</button><button class="hb${detOpen ? ' on' : ''}" data-act="det" title="Chat settings">${icon('info', 18)}</button></div></div>
    <div class="msgs" id="msgs"><div class="day">Today</div>${c.msgs.map((m, i) => msgHTML(c, m, i)).join('')}</div>
    ${c.request ? `<div class="comp" style="padding:14px 16px;display:flex;align-items:center;gap:10px"><span style="flex:1;color:var(--dim);font-size:13px">${esc(c.name)} wants to message you on ${net.name}.</span><button class="btn sec" data-act="block">Block</button><button class="btn pri" data-act="accept">Accept</button></div>` : `
    <div class="comp">${rq}
      <div class="row1"><button class="cb" title="Attach">${icon('attach', 18)}</button>
        <textarea id="ta" placeholder="${c.agent ? `Message ${esc(c.name)}` : 'Write a message'}">${esc(c.draft || '')}</textarea>
        <button class="cb" title="Emoji">${icon('smile', 18)}</button><button class="cb send" data-act="send" title="Send (Enter)">${icon('send', 17)}</button></div>
      <div class="row2">${via}${c.agent || c.agentAccess !== 'draft' ? '' : `<button class="ai-link" data-act="draft">${icon('sparkle', 13)} Draft with Dots</button>`}</div>
    </div>`}`;
  const ms = $('msgs');
  ms.scrollTop = ms.scrollHeight;
  restoreFocus(focus);
}

function seg(name, value, opts) {
  return `<div class="seg">${opts.map(([v, l]) => `<button class="${value === v ? 'on' : ''}" data-seg="${name}" data-v="${v}">${l}</button>`).join('')}</div>`;
}

function renderDet() {
  const det = $('det');
  det.hidden = !detOpen;
  const c = current();
  if (!detOpen || !c) return;
  const top = `<div class="top">${avatar(c, 68, false)}<div class="nm">${esc(c.name)}</div><div class="sub">${c.agent ? 'External agent' : c.group ? `Group on ${NETS[c.net].name}` : `${[c.net, ...(c.alt || [])].length} network${c.alt ? 's' : ''}`}</div>
    <div class="qa"><button class="${c.pinned ? 'on' : ''}" data-tog="pinned">${icon('pin', 17)}${c.pinned ? 'Pinned' : 'Pin'}</button><button class="${c.muted ? 'on' : ''}" data-tog="muted">${icon(c.muted ? 'mute' : 'bell', 17)}${c.muted ? 'Muted' : 'Mute'}</button><button data-tog="unread">${icon('eye', 17)}Unread</button><button class="${c.archived ? 'on' : ''}" data-tog="archived">${icon('archive', 17)}${c.archived ? 'Archived' : 'Archive'}</button></div></div>`;
  if (c.agent) {
    const scopes = c.id === 'dots'
      ? [['ok', 'Read Family and Work chats'], ['ok', 'Draft replies'], ['ok', 'Send, after you approve each one'], ['no', 'Read anything else']]
      : [['ok', 'Read Design Guild (Discord)'], ['no', 'Draft or send'], ['no', 'Read anything else']];
    det.innerHTML = `${top}
      <div class="dsec"><h4>What ${esc(c.name)} can do</h4>${scopes.map(([k, t]) => `<div class="scope"><span class="${k}">${icon(k === 'ok' ? 'check' : 'x', 15)}</span>${t}</div>`).join('')}
        <div class="hint">${icon('info', 14)}<span>Change access per chat from that chat's settings.</span></div></div>
      <div class="dsec"><h4>Activity</h4><div class="scope">${icon('eye', 15)} 14 reads today</div><div class="scope">${icon('pencil', 15)} 3 drafts · 1 waiting</div>
        <button class="btn sec" style="margin-top:10px;width:100%;justify-content:center">View audit log</button></div>
      <div class="dsec"><button class="btn sec" style="width:100%;justify-content:center;color:#dc2626">Disconnect ${esc(c.name)}</button></div>`;
    return;
  }
  const nets = [c.net, ...(c.alt || [])];
  det.innerHTML = `${top}
    ${c.group ? `<div class="dsec"><h4>Members</h4>${['You', 'Priya', 'Marco', 'Dev'].map((n) => `<div class="member">${avatar({ name: n, net: c.net }, 24, false)}${n}</div>`).join('')}</div>`
    : `<div class="dsec"><h4>Networks</h4>${nets.map((k) => `<div class="nrow">${netBadge(k, 22)}<div class="x"><div>${NETS[k].name}</div><div>${k === 'wa' ? '+1 555 010 2231' : k === 'sg' ? 'Signal username' : NETS[k].name + ' account'}</div></div>${k === c.via ? '<span class="tag">Sending</span>' : ''}</div>`).join('')}
      ${c.request ? '' : `<button class="btn ghost" style="padding:0;height:26px;margin-top:4px">${icon('plus', 14)} Link another account</button>`}</div>`}
    <div class="dsec"><h4>${icon('bell', 12)} Notify me</h4>${seg('notify', c.notify, [['all', 'Everything'], ['mentions', 'Mentions'], ['off', 'Off']])}</div>
    <div class="dsec"><h4>${icon('tag', 12)} Labels</h4><div class="lchips">${Object.keys(LABELS).map((l) => `<button class="lchip${(c.labels || []).includes(l) ? ' on' : ''}" data-lab="${l}"><i style="background:${LABELS[l]}"></i>${l}</button>`).join('')}<button class="lchip">${icon('plus', 12)}</button></div></div>
    <div class="dsec"><h4>${icon('sparkle', 12)} Dots in this chat</h4>${seg('agent', c.agentAccess, [['none', 'No access'], ['read', 'Read'], ['draft', 'Draft']])}
      <div class="hint">${icon('lock', 14)}<span>${c.agentAccess === 'none' ? "Dots can't see this chat." : c.agentAccess === 'read' ? 'Dots can read and summarize, but not write.' : 'Dots can suggest replies. Anything it sends waits for your approval.'}</span></div></div>
    <div class="sealed">${icon('lock', 14)}<span>Sealed. Messages are stored encrypted to your devices; the server can't read them.</span></div>`;
}

function render() { renderRail(); renderList(); renderChat(); renderDet(); }

function select(id) {
  sel = id;
  replyTo = null;
  const c = current();
  if (c) { if (!c.muted) c.unread = 0; c.mention = false; }
  closeVia();
  render();
}

function toast(text) {
  const t = $('toast');
  t.innerHTML = text;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 3200);
}

function sendFrom(c, text, by, quote) {
  const m = { from: 'me', text, t: nowTime(), by, quote };
  c.msgs.push(m);
  c.time = m.t;
  simulateSend(m, () => { if (sel === c.id) renderChat(); else renderList(); });
}

function send() {
  const c = current();
  const ta = $('ta');
  if (!c || !ta || !ta.value.trim()) return;
  const q = replyTo != null ? c.msgs[replyTo].text : undefined;
  sendFrom(c, ta.value.trim(), c.draftAi ? 'drafted by Dots' : null, q);
  c.draft = '';
  c.draftAi = false;
  replyTo = null;
  if (c.via !== c.net) toast(`Sent to ${esc(c.name)} on ${NETS[c.via].name}`);
  render();
  $('ta')?.focus();
}

function closeVia() { $('viamenu').hidden = true; }
function openVia(btn) {
  const c = current();
  const m = $('viamenu');
  m.innerHTML = `<div class="h">Send ${esc(c.name)} messages via</div>${[c.net, ...(c.alt || [])].map((k) => `<button data-via="${k}">${netBadge(k, 18)} ${NETS[k].name}${k === c.via ? `<span class="ck">${icon('check', 15)}</span>` : ''}</button>`).join('')}`;
  const sr = stage.getBoundingClientRect();
  const s = sr.width / 1280;
  const br = btn.getBoundingClientRect();
  m.style.left = `${(br.left - sr.left) / s}px`;
  m.style.top = `${(br.top - sr.top) / s - 8 - 44 * ([c.net, ...(c.alt || [])].length) - 28}px`;
  m.hidden = false;
}

stage.addEventListener('click', (e) => {
  const t = e.target.closest('[data-view],[data-net],[data-label],[data-chip],[data-id],[data-act],[data-react],[data-reply],[data-ap],[data-seg],[data-lab],[data-tog],[data-via],[data-fix]');
  if (!e.target.closest('#viamenu,[data-act="via"]')) closeVia();
  if (!t) return;
  const c = current();
  const d = t.dataset;
  if (d.view) { view = { kind: 'view', id: d.view }; return renderRail(), renderList(); }
  if (d.net) { view = { kind: 'net', id: d.net }; return renderRail(), renderList(); }
  if (d.label) { view = { kind: 'label', id: d.label }; return renderRail(), renderList(); }
  if (d.chip) { chip = d.chip; return renderList(); }
  if (d.id) return select(d.id);
  if (d.react) {
    const m = c.msgs[+d.i];
    m.reactions = m.reactions || {};
    m.mine = m.mine || {};
    m.mine[d.react] = !m.mine[d.react];
    m.reactions[d.react] = (m.reactions[d.react] || 0) + (m.mine[d.react] ? 1 : -1);
    return renderChat();
  }
  if (d.reply) { replyTo = +d.reply; renderChat(); return $('ta')?.focus(); }
  if (d.fix) {
    const m = c.msgs[+d.fix];
    m.status = 'checking';
    renderChat();
    setTimeout(() => { m.status = 'delivered'; renderChat(); toast('Confirmed delivered. No resend needed.'); }, 1100);
    return;
  }
  if (d.ap) {
    const a = c.msgs[+d.i].approval;
    if (d.ap === 'edit') { a.state = 'editing'; renderChat(); return $('aedit').focus(); }
    if (d.ap === 'reject') { a.state = 'rejected'; return render(); }
    const to = byId(a.to);
    if (to.agentAccess !== 'draft') { a.state = 'revoked'; toast(`Discarded. Dots no longer has access to ${esc(to.name)}`); return render(); }
    if (a.state === 'editing') {
      const text = (a.edit ?? a.text).trim();
      if (!text) { toast('The message is empty. Write something, or reject the draft.'); return $('aedit').focus(); }
      a.text = text;
    }
    a.state = 'sent';
    c.unread = 0;
    sendFrom(to, a.text, 'sent by Dots');
    toast(`Sent to ${esc(to.name)} on ${NETS[to.net].name}`);
    return render();
  }
  if (d.seg === 'notify') { c.notify = d.v; c.muted = d.v === 'off'; return render(); }
  if (d.seg === 'agent') {
    c.agentAccess = d.v;
    if (d.v !== 'draft' && revokeApprovals(chats, c.id)) toast(`Dots's pending draft for ${esc(c.name)} was discarded`);
    return render();
  }
  if (d.lab) { c.labels = c.labels || []; c.labels = c.labels.includes(d.lab) ? c.labels.filter((x) => x !== d.lab) : [...c.labels, d.lab]; return render(); }
  if (d.tog) {
    if (d.tog === 'unread') { c.unread = c.unread || 1; toast('Marked unread'); return render(); }
    c[d.tog] = !c[d.tog];
    if (d.tog === 'muted') c.notify = c.muted ? 'off' : c.group ? 'mentions' : 'all';
    if (d.tog === 'archived') toast(c.archived ? `Archived ${esc(c.name)}` : `Moved ${esc(c.name)} back to the inbox`);
    return render();
  }
  if (d.via) { c.via = d.via; closeVia(); return render(); }
  const act = d.act;
  if (act === 'det') { detOpen = !detOpen; return renderChat(), renderDet(); }
  if (act === 'send') return send();
  if (act === 'unreply') { replyTo = null; return renderChat(); }
  if (act === 'via') return $('viamenu').hidden ? openVia(t) : closeVia();
  if (act === 'draft') {
    if (c.agentAccess !== 'draft') return toast(`Dots doesn't have draft access to ${esc(c.name)}`);
    c.draft = DRAFTS[c.id] || 'Sounds good!';
    c.draftAi = true;
    renderChat();
    return $('ta').focus();
  }
  if (act === 'accept') { c.request = false; toast(`Accepted ${esc(c.name)}`); view = { kind: 'view', id: 'inbox' }; return render(); }
  if (act === 'block') { c.request = false; c.archived = true; toast(`Blocked ${esc(c.name)}`); sel = visible()[0]?.id; return render(); }
  if (act === 'new') return toast('New message: pick a person, then a network');
  if (act === 'connect') return toast('Opens the shared login stepper for any network');
  if (act === 'settings') return toast('Settings: account, devices, agents, backups');
});

stage.addEventListener('input', (e) => {
  if (e.target.id === 'q') renderList();
  if (e.target.id === 'ta') { const c = current(); c.draft = e.target.value; if (!c.draft) c.draftAi = false; }
  if (e.target.id === 'aedit') current().msgs.find((m) => m.kind === 'approval').approval.edit = e.target.value;
});

stage.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'ta') { e.preventDefault(); send(); }
  if (e.key === 'Escape') { closeVia(); if (replyTo != null) { replyTo = null; renderChat(); } }
});

select('mom');
</script>
</body>
</html>
