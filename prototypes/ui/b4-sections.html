<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossroads Sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crossroads-core.css">
<style>
  :root { --list-w: 332px; }
  .list { background: var(--rail); }
  .sbar { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px; }
  .sbar.top { border-bottom: 1px solid var(--line); }
  .sbar.bottom { border-top: 1px solid var(--line); height: 52px; }
  .sbar .search { flex: 1; min-width: 0; height: 34px; background: #fff; }
  .sbar .search input { width: 100%; }
  .sbar .search kbd { font: 500 10.5px/1 'DM Sans', sans-serif; color: var(--faint); border: 1px solid var(--line2); border-radius: 4px; padding: 2px 5px; }
  .sbar .iconbtn:hover { background: #e9ecf0; }
  .iconbtn.on { background: var(--accent-soft); color: var(--accent); }
  .iconbtn .fdot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--rail); }
  .iconbtn { position: relative; }
  .acct { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 8px 0 4px; border-radius: 10px; font-weight: 600; }
  .acct:hover { background: #e9ecf0; }
  .acct .meav { width: 28px; height: 28px; }
  .acct .sub { font-size: 11.5px; color: var(--faint); font-weight: 500; }
  .acct .nm { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
  .sbar .sp { flex: 1; }
  .hbtn { height: 32px; padding: 0 9px; border-radius: 9px; display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: var(--dim); }
  .hbtn:hover { background: #e9ecf0; }
  .hbtn .dots { display: flex; gap: 3px; }
  .hbtn .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .hbtn .dots i.w { background: var(--warn); }
  .hbtn .w { color: var(--warn); }

  .rows { padding: 4px 8px 12px; }
  .filterline { display: flex; align-items: center; gap: 6px; margin: 6px 4px 2px; font-size: 12.5px; color: var(--dim); flex-wrap: wrap; }
  .filterline b { font-weight: 600; color: var(--text); display: inline-flex; align-items: center; gap: 5px; }
  .filterline button { color: var(--accent); font-weight: 600; margin-left: auto; }
  .sh { display: flex; align-items: center; gap: 6px; padding: 12px 8px 5px; font-size: 11.5px; font-weight: 600; color: var(--faint); letter-spacing: .05em; text-transform: uppercase; }
  .sh .n { color: var(--accent); }
  .div { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 8px; margin-top: 2px; border-radius: 8px; color: var(--dim); font-size: 13px; font-weight: 600; text-align: left; }
  .div:hover { background: #e9ecf0; color: var(--text); }
  .div .chev { color: var(--faint); transition: transform .15s; }
  .div.open .chev { transform: rotate(90deg); }
  .div .n { font-size: 12px; color: var(--faint); font-weight: 500; }
  .div .ln { flex: 1; height: 1px; background: var(--line2); }
  .div .ic { color: var(--faint); }
  .group-first { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; }
  .row { position: relative; }
  .row:hover { background: #eceef2; }
  .row.sel { background: #fff; box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(15,23,42,.06); }
  .row .ra { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: none; gap: 2px; background: #fff; border-radius: 9px; padding: 2px; box-shadow: 0 0 0 1px var(--line), 0 4px 10px rgba(15,23,42,.08); }
  .row:hover .ra { display: flex; }
  .ra button { height: 28px; min-width: 28px; padding: 0 6px; border-radius: 7px; display: flex; align-items: center; justify-content: center; gap: 5px; color: var(--dim); font-size: 12px; font-weight: 600; }
  .ra button:hover { background: var(--soft); color: var(--text); }
  .row .until { font-size: 11.5px; color: var(--accent-ink); background: var(--accent-soft); border-radius: 5px; padding: 0 6px; line-height: 18px; flex: none; }
  .row .woke { font-size: 10.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 0 5px; line-height: 16px; letter-spacing: .02em; }
  .menu .ok { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .menu .bad { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .menu .st2 { font-size: 11.5px; color: var(--faint); margin-left: auto; }
  .menu .st2.w { color: var(--warn); font-weight: 600; }
  /* settings panel */
  .settings { position: absolute; inset: 0; z-index: 8; background: rgba(15,23,42,.32); display: flex; align-items: center; justify-content: center; }
  .settings[hidden] { display: none; }
  .sp-panel { width: 900px; height: 620px; background: #fff; border-radius: 16px; box-shadow: 0 30px 80px rgba(15,23,42,.3); display: flex; overflow: hidden; }
  .sp-nav { width: 220px; flex: none; background: var(--rail); border-right: 1px solid var(--line); padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; }
  .sp-nav h3 { font-size: 16px; font-weight: 700; margin: 0 8px 14px; letter-spacing: -.01em; }
  .sp-nav button { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--dim); font-weight: 500; text-align: left; }
  .sp-nav button:hover { background: #e9ecf0; color: var(--text); }
  .sp-nav button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(15,23,42,.05); }
  .sp-body { flex: 1; overflow-y: auto; padding: 22px 28px 28px; position: relative; }
  .sp-body h2 { font-size: 19px; margin: 0 0 4px; letter-spacing: -.015em; }
  .sp-body .lead { color: var(--dim); margin: 0 0 14px; font-size: 13.5px; }
  .sp-close { position: absolute; top: 16px; right: 16px; }
  .setting { display: flex; gap: 18px; align-items: center; padding: 15px 0; border-top: 1px solid var(--line); }
  .setting.col { display: block; }
  .setting .tx { flex: 1; min-width: 0; }
  .setting .tx b { display: block; font-weight: 600; }
  .setting .tx span { display: block; font-size: 12.5px; color: var(--dim); margin-top: 2px; line-height: 1.4; }
  .switch { width: 38px; height: 22px; border-radius: 11px; background: #cbd5e1; position: relative; flex: none; transition: background .15s; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.2); transition: left .15s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 19px; }
  .layouts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .layout { text-align: left; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); padding: 12px; display: grid; gap: 6px; }
  .layout:hover { background: var(--soft); }
  .layout.on { box-shadow: 0 0 0 2px var(--accent-2); background: var(--accent-soft); }
  .layout .mt { font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
  .layout.on .mt { color: var(--accent-ink); }
  .layout .ma { font-size: 12.5px; color: var(--dim); line-height: 1.4; }
  .mini { height: 128px; background: var(--rail); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .mini .r { height: 13px; flex: none; border-radius: 4px; background: #fff; box-shadow: 0 0 0 1px var(--line); display: flex; align-items: center; gap: 4px; padding: 0 5px; }
  .mini .r i { width: 6px; height: 6px; border-radius: 50%; background: #cbd5e1; flex: none; }
  .mini .r em { flex: 1; height: 3px; background: #e2e8f0; border-radius: 2px; }
  .mini .r.u i { background: var(--accent); }
  .mini .r.u em { background: #94a3b8; }
  .mini .h { font-size: 7.5px; font-weight: 700; color: var(--faint); letter-spacing: .06em; margin: 1px 2px; }
  .mini .d { height: 10px; flex: none; display: flex; align-items: center; gap: 4px; font-size: 7.5px; font-weight: 600; color: var(--faint); margin: 0 2px; }
  .mini .d::after { content: ''; flex: 1; height: 1px; background: var(--line2); }
  .srow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .srow .tx { flex: 1; }
  .srow .tx div:first-child { font-weight: 600; }
  .srow .tx div:last-child { font-size: 12.5px; color: var(--dim); }
  #stage.no-previews .row .pv { visibility: hidden; }
  #stage.no-badges .row .netb { display: none; }
</style>
</head>
<body>
<div class="backbar"><a class="back" href="index.html">← All prototypes</a></div>
<div id="wrap"><div id="stage" tabindex="0">
  <div class="main">
    <section class="list">
      <div class="sbar top">
        <label class="search" id="searchbox"><input id="q" placeholder="Search" autocomplete="off"><kbd>⌘K</kbd></label>
        <button class="iconbtn" id="fbtn" data-menu="filter" title="Filter by network or label"></button>
        <button class="iconbtn" id="newbtn" data-act="new" title="New message"></button>
      </div>
      <div class="rows" id="rows"></div>
      <div class="sbar bottom">
        <button class="acct" data-menu="account" title="Account"><span class="meav">IC</span><span class="nm">Isaac<span class="sub">trioditis.home</span></span></button>
        <span class="sp"></span>
        <button class="hbtn" id="hbtn" data-menu="health" data-align="right" title="Network status"></button>
        <button class="iconbtn" data-act="open-settings" title="Settings" id="setbtn"></button>
      </div>
    </section>
    <section class="chat" id="chat"></section>
    <aside class="det" id="det"></aside>
  </div>
  <div class="via-menu" id="viamenu" hidden></div>
  <div class="menu" id="menu" hidden></div>
  <div class="settings" id="settings" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div></div>

<script src="shared.js"></script>
<script>
// Iteration 4 (from B1): one sidebar with a top bar and a bottom bar, like T3 Code.
// Two sidebar layouts, picked in Settings → Appearance (the gear) and remembered in this browser:
//   simple:  the default; every chat in one list, newest first; requests, snoozed and archived via the filter menu.
//   focused: opt-in; Unread on top, read, snoozed, scheduled, requests and archived chats fold into dividers.
// #focused or #simple in the address picks one directly.
const MODES = {
  simple: { name: 'Simple', about: 'Every chat in one list, newest first. Nothing else in the way.' },
  focused: { name: 'Focused', about: 'Unread on top. Read, snoozed, scheduled and archived chats fold away until you open them.' },
};
function initialMode() {
  const h = location.hash.slice(1);
  if (MODES[h]) return h;
  try { const saved = localStorage.getItem('trioditis.sidebar'); if (MODES[saved]) return saved; } catch { /* storage can be blocked */ }
  return 'simple';
}
let mode = initialMode();
function setMode(m) {
  mode = m;
  try { localStorage.setItem('trioditis.sidebar', m); } catch { /* storage can be blocked */ }
  if (location.hash) history.replaceState(null, '', `#${m}`);
  render();
}

const open = { read: false, snoozed: false, scheduled: false, requests: false, archived: false };
// What Simple mode lists: everyday chats, or one of the places Focused keeps in dividers.
const SIMPLE_SHOWS = [['chats', 'All chats', 'inbox'], ['requests', 'Requests', 'user'], ['snoozed', 'Snoozed', 'snooze'], ['archived', 'Archived', 'archive']];
let simpleShow = 'chats';
// [menu label, time shown in the menu, how the row shows it]
const SNOOZE_OPTS = [['Later today', '6:00 PM', 'today 6:00 PM'], ['Tomorrow', '9:00 AM', 'tomorrow 9:00 AM'], ['This weekend', 'Sat 10:00 AM', 'Sat 10:00 AM'], ['Next week', 'Mon 9:00 AM', 'Mon 9:00 AM']];

const isUnread = (c) => (c.unread > 0 && !c.muted) || (c.id === sel && c.wasUnread);
const scheduledOf = (c) => c.msgs.filter((m) => m.status === 'scheduled');

// Sort key from the fake "9:41" / "Tue" timestamps; sending a message sets c.ts to now.
const DAY_RANK = { Yesterday: 5000, Tue: 3000, Mon: 2000, Sun: 1000 };
function rank(time) {
  const m = /^(\d+):(\d+)$/.exec(time);
  return m ? 10000 + +m[1] * 60 + +m[2] : DAY_RANK[time] || 0;
}
const byPinThenRecent = (a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.ts ?? rank(b.time)) - (a.ts ?? rank(a.time));

function sideRow(c, kind) {
  const pending = c.msgs.some((m) => m.kind === 'approval' && m.approval.state === 'pending');
  const sch = scheduledOf(c)[0];
  const line = kind === 'scheduled' && sch ? `${icon('clock', 12)} ${esc(sch.at)} · ${esc(sch.text)}` : esc(preview(c));
  const right = kind === 'snoozed' ? `<span class="until">${esc(c.snoozed)}</span>` : `<span class="tm">${c.time}</span>`;
  const badge = c.mention ? '<span class="pill">@</span>' : c.unread ? `<span class="pill${c.muted ? ' muted' : ''}">${c.unread}</span>` : '';
  const acts = kind === 'snoozed'
    ? `<button data-rowact="wake" data-cid="${c.id}">${icon('bell', 14)} Wake</button>`
    : kind === 'archived'
      ? `<button data-rowact="restore" data-cid="${c.id}">${icon('inbox', 14)} Restore</button>`
      : kind === 'scheduled' || kind === 'requests' ? ''
        : `<button data-rowact="archive" data-cid="${c.id}" title="Archive">${icon('archive', 15)}</button><button data-menu="snooze" data-cid="${c.id}" title="Snooze">${icon('snooze', 15)}</button>`;
  const schedIcon = sch && kind !== 'scheduled' ? `<span class="ic" title="Has a scheduled message">${icon('clock', 12)}</span>` : '';
  return `<div class="row${c.id === sel ? ' sel' : ''}${isUnread(c) ? '' : ' read'}" data-id="${c.id}">${avatar(c, 40)}
    <div class="mid"><div class="l1"><span class="nm">${esc(c.name)}</span>${c.pinned ? `<span class="ic">${icon('pin', 12)}</span>` : ''}${c.muted ? `<span class="ic">${icon('mute', 12)}</span>` : ''}${schedIcon}${c.woke ? '<span class="woke" title="Back from snooze">WOKE</span>' : ''}${right}</div>
    <div class="l2"><span class="pv${pending ? ' need' : ''}">${line}</span>${kind === 'snoozed' ? '' : badge}</div></div>
    ${acts ? `<div class="ra">${acts}</div>` : ''}</div>`;
}

function divider(key, label, ic, list, kind) {
  if (!list.length) return '';
  const isOpen = open[key];
  return `<button class="div${isOpen ? ' open' : ''}" data-sec="${key}"><span class="chev">${icon('down', 14).replace('<svg', '<svg style="transform:rotate(-90deg)"')}</span><span class="ic">${icon(ic, 14)}</span>${label}<span class="n">${list.length}</span><span class="ln"></span></button>
    ${isOpen ? list.map((c) => sideRow(c, kind)).join('') : ''}`;
}

// Splits the filtered chats into Focused mode's sections. rows() draws them and shown() lists
// what is on screen, so the core can keep the open chat in view.
function layout(list) {
  const live = list.filter((c) => !c.archived && !c.snoozed && !c.request).sort(byPinThenRecent);
  return {
    unread: live.filter(isUnread),
    read: live.filter((c) => !isUnread(c)),
    snoozed: list.filter((c) => c.snoozed && !c.archived),
    scheduled: list.filter((c) => scheduledOf(c).length),
    requests: list.filter((c) => c.request && !c.archived),
    archived: list.filter((c) => c.archived),
  };
}
const simpleTest = {
  chats: (c) => !c.archived && !c.snoozed && !c.request,
  requests: (c) => c.request && !c.archived,
  snoozed: (c) => c.snoozed && !c.archived,
  archived: (c) => c.archived,
};
const simpleList = (list) => list.filter(simpleTest[simpleShow]).sort(byPinThenRecent);
const simpleKind = () => ({ chats: 'active', requests: 'requests', snoozed: 'snoozed', archived: 'archived' })[simpleShow];
const searching = () => !!($('q').value || '').trim();

const NAV = {
  schedule: true,
  base: () => true,
  render() {
    const active = (filt.net ? 1 : 0) + (filt.label ? 1 : 0) + (mode === 'simple' && simpleShow !== 'chats' ? 1 : 0);
    $('fbtn').classList.toggle('on', !!active);
    $('fbtn').innerHTML = `${icon('filter', 17)}${active ? '<span class="fdot"></span>' : ''}`;
    const bad = unhealthy();
    $('hbtn').innerHTML = `<span class="dots">${NET_KEYS.map((k) => `<i class="${NETS[k].health ? 'w' : ''}"></i>`).join('')}</span>${bad.length ? `<span class="w">${bad.length} offline</span>` : ''}`;
  },
  shown(list) {
    if (searching()) return list;
    if (mode === 'simple') return simpleList(list);
    const s = layout(list);
    const out = [...s.unread];
    for (const key of ['read', 'snoozed', 'scheduled', 'requests', 'archived']) if (open[key]) out.push(...s[key]);
    return [...new Set(out)];
  },
  rows(list) {
    const parts = [];
    if (mode === 'simple' && simpleShow !== 'chats' && !searching()) parts.push(`<b>${icon(SIMPLE_SHOWS.find((s) => s[0] === simpleShow)[2], 14)} ${SIMPLE_SHOWS.find((s) => s[0] === simpleShow)[1]}</b>`);
    if (filt.net) parts.push(`<b>${netBadge(filt.net, 14)} ${NETS[filt.net].name}</b>`);
    if (filt.label) parts.push(`<b><span style="width:8px;height:8px;border-radius:50%;background:${LABELS[filt.label]}"></span>${filt.label}</b>`);
    const head = parts.length ? `<div class="filterline">Showing ${parts.join(' · ')}<button data-clear="all">Clear</button></div>` : '';
    if (searching()) {
      return `${head}<div class="sh">Results in all chats <span class="n">${list.length}</span></div>${list.map((c) => sideRow(c, c.snoozed ? 'snoozed' : c.archived ? 'archived' : 'active')).join('') || '<div class="none">No chats match.</div>'}`;
    }
    if (mode === 'simple') {
      return head + (simpleList(list).map((c) => sideRow(c, simpleKind())).join('') || '<div class="none">Nothing here.</div>');
    }
    const { unread, read, snoozed, scheduled, requests, archived } = layout(list);
    let html = head;
    html += unread.length
      ? `<div class="sh">Unread <span class="n">${unread.length}</span></div>${unread.map((c) => sideRow(c, 'active')).join('')}`
      : `<div class="none" style="padding:26px 10px 18px">${icon('check', 18)}<br>You're all caught up.</div>`;
    html += `<div class="group-first">${divider('read', 'Read', 'eye', read, 'active')}`
      + divider('snoozed', 'Snoozed', 'snooze', snoozed, 'snoozed')
      + divider('scheduled', 'Scheduled', 'clock', scheduled, 'scheduled')
      + divider('requests', 'Requests', 'user', requests, 'requests')
      + divider('archived', 'Archived', 'archive', archived, 'archived')
      + '</div>';
    return html;
  },
  click(e) {
    if (settingsClick(e)) return true;
    if (mode === 'simple' && e.target.closest('[data-act="accept"]')) simpleShow = 'chats';
    const show = e.target.closest('[data-show]');
    if (show) { simpleShow = show.dataset.show; closeMenu(); refreshNav(); return true; }
    if (e.target.closest('[data-clear="all"]')) simpleShow = 'chats';
    const sec = e.target.closest('[data-sec]');
    if (sec) { open[sec.dataset.sec] = !open[sec.dataset.sec]; renderList(); return true; }
    const ra = e.target.closest('[data-rowact]');
    if (ra) {
      const before = shownIds();
      const c = byId(ra.dataset.cid);
      const a = ra.dataset.rowact;
      if (a === 'archive') { c.archived = true; c.unread = 0; c.woke = false; toast(`Archived <b>${esc(c.name)}</b>. Find it under Archived.`); }
      if (a === 'restore') { c.archived = false; toast(`Moved ${esc(c.name)} back`); }
      if (a === 'wake') { c.snoozed = null; c.woke = true; toast(`${esc(c.name)} is back in your list`); }
      if (a === 'snooze') {
        c.snoozed = ra.dataset.when;
        c.woke = false;
        closeMenu();
        toast(`Snoozed <b>${esc(c.name)}</b> until ${esc(c.snoozed)}`);
      }
      reconcileAfter(before);
      return true;
    }
    return false;
  },
  menus: {
    filter() {
      const all = visible();
      const shows = mode === 'simple'
        ? `<div class="mh">Show</div>${SIMPLE_SHOWS.map(([id, name, ic]) => `<button class="mi${simpleShow === id ? ' on' : ''}" data-show="${id}">${icon(ic, 16)}${name}<span class="c">${id === 'chats' ? '' : all.filter(simpleTest[id]).length || ''}</span></button>`).join('')}`
        : '';
      const nets = NET_KEYS.map((k) => `<button class="mi${filt.net === k ? ' on' : ''}" data-net="${k}">${netBadge(k, 16)}${NETS[k].name}${maturityTag(k)}<span class="c">${netCount(k) || ''}</span></button>`).join('');
      const labels = Object.keys(LABELS).map((l) => `<button class="mi${filt.label === l ? ' on' : ''}" data-label="${l}"><span class="dot" style="background:${LABELS[l]}"></span>${l}<span class="c">${labelCount(l) || ''}</span></button>`).join('');
      const any = filt.net || filt.label || (mode === 'simple' && simpleShow !== 'chats');
      return `${shows}<div class="mh">Only this network</div>${nets}<div class="mh">Only this label</div>${labels}${any ? `<div class="sep"></div><button class="mi" data-clear="all">${icon('x', 15)} Clear filters</button>` : ''}`;
    },
    snooze(anchor) {
      const id = anchor.dataset.cid;
      return `<div class="mh">Snooze until</div>${SNOOZE_OPTS.map(([n, w, shown]) => `<button class="mi" data-rowact="snooze" data-cid="${id}" data-when="${shown}">${icon('snooze', 15)} ${n}<span class="c">${w}</span></button>`).join('')}
        <div class="sep"></div><button class="mi" data-act="custom-time">${icon('pencil', 15)} Pick a date and time…</button>`;
    },
    health() {
      return `<div class="mh">Networks</div>${NET_KEYS.map((k) => `<div class="mi" style="cursor:default">${netBadge(k, 16)}${NETS[k].name}${maturityTag(k)}${NETS[k].health ? `<span class="st2 w">${NETS[k].health}</span>` : '<span class="st2">Connected</span>'}</div>`).join('')}
        <div class="sep"></div><button class="mi" data-act="connect">${icon('plus', 15)} Connect a network</button>`;
    },
  },
};

/* Settings panel, opened from the gear or the account menu. Sidebar layout is one setting in Appearance. */
const SETTINGS_SECTIONS = [
  ['appearance', 'Appearance', 'eye'],
  ['notifications', 'Notifications', 'bell'],
  ['networks', 'Networks', 'inbox'],
  ['agents', 'Agents', 'sparkle'],
  ['devices', 'Devices and keys', 'lock'],
];
const prefs = { previews: true, badges: true, desktop: true, sound: false, quiet: true, banners: true };
let settingsSection = 'appearance';

const sw = (key, on) => `<button class="switch${on ? ' on' : ''}" data-pref="${key}" role="switch" aria-checked="${on}" aria-label="${key}"></button>`;
const setting = (title, about, control) => `<div class="setting"><div class="tx"><b>${title}</b><span>${about}</span></div>${control}</div>`;

// Small drawings of each sidebar layout for the picker.
function miniFocused() {
  const u = '<div class="r u"><i></i><em></em></div>';
  return `<div class="mini"><div class="h">UNREAD</div>${u}${u}${u}<div class="d">Read</div><div class="d">Snoozed</div><div class="d">Scheduled</div><div class="d">Archived</div></div>`;
}
function miniSimple() {
  const r = (u) => `<div class="r${u ? ' u' : ''}"><i></i><em></em></div>`;
  return `<div class="mini">${r(1)}${r(1)}${r(0)}${r(1)}${r(0)}${r(0)}${r(0)}</div>`;
}

function settingsBody() {
  if (settingsSection === 'appearance') {
    return `<h2>Appearance</h2><p class="lead">How Trioditis looks on this device.</p>
      <div class="setting col"><div class="tx"><b>Sidebar layout</b><span>Pick how the chat list is organized. You can switch at any time.</span></div>
        <div class="layouts">${Object.entries(MODES).map(([id, m]) => `<button class="layout${mode === id ? ' on' : ''}" data-mode="${id}">${id === 'focused' ? miniFocused() : miniSimple()}<span class="mt">${m.name}${mode === id ? icon('check', 16) : ''}</span><span class="ma">${m.about}</span></button>`).join('')}</div></div>
      ${setting('Message previews', 'Show the latest message under each chat in the list.', sw('previews', prefs.previews))}
      ${setting('Network badges', 'Show which network each chat is on, on its picture.', sw('badges', prefs.badges))}`;
  }
  if (settingsSection === 'notifications') {
    return `<h2>Notifications</h2><p class="lead">Per-chat settings live in each chat's details panel and override these.</p>
      ${setting('Desktop notifications', 'Show a notification when a message arrives and the app is in the background.', sw('desktop', prefs.desktop))}
      ${setting('Sound', 'Play a sound for new messages.', sw('sound', prefs.sound))}
      ${setting('Quiet muted chats', "Muted chats never notify, even when you're mentioned.", sw('quiet', prefs.quiet))}
      ${setting('Network problems', 'Notify when a network disconnects, like a phone going offline.', sw('banners', prefs.banners))}`;
  }
  if (settingsSection === 'networks') {
    return `<h2>Networks</h2><p class="lead">The accounts this server bridges for you.</p>
      ${NET_KEYS.map((k) => `<div class="srow">${netBadge(k, 26)}<div class="tx"><div>${NETS[k].name} ${maturityTag(k)}</div><div${NETS[k].health ? ' style="color:var(--warn)"' : ''}>${NETS[k].health || 'Connected'}</div></div><button class="btn sec" data-act="connect">Manage</button></div>`).join('')}
      <div class="srow"><button class="btn pri" data-act="connect">${icon('plus', 15)} Connect a network</button></div>`;
  }
  if (settingsSection === 'agents') {
    const agents = chats.filter((c) => c.agent);
    return `<h2>Agents</h2><p class="lead">Agents start with no access. You grant it per chat, and anything an agent sends waits for your approval.</p>
      ${agents.map((a) => `<div class="srow">${avatar(a, 32, false)}<div class="tx"><div>${esc(a.name)}</div><div>${esc(a.access)}</div></div><button class="btn sec" data-act="audit">Audit log</button><button class="btn ghost" data-act="disconnect-agent" style="color:#dc2626">Disconnect</button></div>`).join('')}`;
  }
  return `<h2>Devices and keys</h2><p class="lead">Your messages are sealed to these devices. The server can't read them.</p>
    ${[['This computer', 'Linux · active now'], ['iPhone', 'Last seen 2 hours ago'], ['Work laptop', 'Last seen yesterday']].map(([n, d]) => `<div class="srow"><span class="iconbtn" style="background:var(--soft)">${icon('lock', 16)}</span><div class="tx"><div>${n}</div><div>${d}</div></div>${n === 'This computer' ? '' : '<button class="btn ghost" data-act="remove-device">Remove</button>'}</div>`).join('')}
    ${setting('Recovery key', 'Lets you get your messages back if you lose every device. Keep it somewhere safe.', '<button class="btn sec" data-act="recovery">Show recovery key</button>')}`;
}

// Re-rendering replaces the panel's buttons, so remember which one had focus and focus it again.
function focusKey() {
  const f = document.activeElement;
  if (!f || !f.closest('#settings')) return null;
  for (const k of ['ssec', 'mode', 'pref', 'act']) if (f.dataset[k]) return `#settings [data-${k}="${f.dataset[k]}"]`;
  return null;
}
function renderSettings() {
  const key = focusKey();
  $('settings').innerHTML = `<div class="sp-panel" role="dialog" aria-modal="true" aria-label="Settings">
    <nav class="sp-nav"><h3>Settings</h3>${SETTINGS_SECTIONS.map(([id, name, ic]) => `<button class="${settingsSection === id ? 'on' : ''}" data-ssec="${id}">${icon(ic, 16)}${name}</button>`).join('')}</nav>
    <div class="sp-body"><button class="iconbtn sp-close" data-act="close-settings" title="Close (Esc)">${icon('x', 18)}</button>${settingsBody()}</div></div>`;
  if (key) document.querySelector(key)?.focus();
}
// While Settings is open the app behind it is inert: no focus, clicks or typing reach it.
let settingsReturnFocus = null;
function setBackgroundInert(on) {
  for (const el of document.querySelectorAll('#stage > .main, #menu, #viamenu')) el.inert = on;
}
function openSettings(section = 'appearance') {
  closeMenu();
  closeVia();
  settingsReturnFocus = document.activeElement;
  settingsSection = section;
  renderSettings();
  $('settings').hidden = false;
  setBackgroundInert(true);
  $('settings').querySelector(`[data-ssec="${section}"]`)?.focus();
}
function closeSettings() {
  $('settings').hidden = true;
  setBackgroundInert(false);
  // Return to whatever opened Settings if it's still on screen; a menu item that opened it is
  // hidden by now, so fall back to the gear.
  const back = settingsReturnFocus;
  const usable = back?.isConnected && back.offsetParent !== null && !back.closest('[hidden]');
  (usable ? back : $('setbtn')).focus();
}
const settingsOpen = () => !$('settings').hidden;
function applyPrefs() {
  stage.classList.toggle('no-previews', !prefs.previews);
  stage.classList.toggle('no-badges', !prefs.badges);
}

// Handles clicks for the panel and for whatever opens it; returns true when it handled one.
function settingsClick(e) {
  const t = e.target.closest('[data-act],[data-ssec],[data-mode],[data-pref]');
  if (e.target === $('settings')) { closeSettings(); return true; }
  if (!t) return false;
  const act = t.dataset.act;
  const opens = { 'open-settings': 'appearance', settings: 'appearance', agents: 'agents', devices: 'devices' };
  if (opens[act]) { openSettings(opens[act]); return true; }
  if (!t.closest('#settings')) return false;
  if (act === 'close-settings') { closeSettings(); return true; }
  if (t.dataset.ssec) settingsSection = t.dataset.ssec;
  if (t.dataset.mode) setMode(t.dataset.mode);
  if (t.dataset.pref) { prefs[t.dataset.pref] = !prefs[t.dataset.pref]; applyPrefs(); }
  if (act === 'audit') toast('Audit log: every read, draft, approval and send by this agent');
  if (act === 'disconnect-agent') toast('Disconnect asks you to confirm, then revokes its access');
  if (act === 'remove-device') toast('Removing a device revokes its keys');
  if (act === 'recovery') toast('Asks for your password, then shows the key');
  if (act === 'connect') toast('Opens the shared login stepper for any network');
  renderSettings();
  return true;
}
document.addEventListener('keydown', (e) => {
  if (!settingsOpen()) return;
  if (e.key === 'Escape') { e.preventDefault(); closeSettings(); return; }
  // Keep Tab inside the panel.
  if (e.key === 'Tab') {
    const items = [...$('settings').querySelectorAll('button')];
    const i = items.indexOf(document.activeElement);
    const next = e.shiftKey ? (i <= 0 ? items.length - 1 : i - 1) : (i === items.length - 1 ? 0 : i + 1);
    e.preventDefault();
    items[next].focus();
  }
});
</script>
<script src="crossroads-core.js"></script>
<script>
// Fake state for the sections: two snoozed chats, one that just woke, a scheduled message, an archived chat.
byId('sam').snoozed = 'tomorrow 9:00 AM';
byId('guild').snoozed = 'Mon 9:00 AM';
byId('teresa').woke = true;
byId('dad').archived = true;
chats.forEach((c) => { c.ts = rank(c.time); });
byId('nina').msgs.push({ from: 'me', text: 'Happy birthday Nina! 🎂 Hope it is a great one', t: '', status: 'scheduled', at: 'Friday at 9:00 AM' });
$('newbtn').innerHTML = icon('pencil', 17);
$('setbtn').innerHTML = icon('gear', 18);
render();
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (MODES[h]) { mode = h; render(); } });
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && !settingsOpen()) { e.preventDefault(); $('q').focus(); }
});
</script>
</body>
