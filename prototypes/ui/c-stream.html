<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trioditis Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131211; --surf: #1b1a18; --raise: #23211f; --raise2: #2b2926; --line: #2c2a27; --line2: #3a3733;
    --text: #efebe5; --dim: #aaa39a; --faint: #706a62;
    --accent: #7dd3fc; --accent-2: #38bdf8; --accent-soft: rgba(125,211,252,.12); --accent-ink: #062030;
    --warn: #f5b548; --ok: #6ee7a8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Geist, ui-sans-serif, system-ui, sans-serif; }
  body { background: #0c0b0a; }
  @media (min-width: 1330px) { body { padding: 16px 24px 24px; } }
  .back { display: inline-block; max-width: 1280px; margin: 0 auto; padding: 8px 4px; font: 500 13px/1 system-ui, sans-serif; color: #8f877d; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .backbar { max-width: 1280px; margin: 0 auto; }
  #wrap { position: relative; width: 100%; max-width: 1280px; margin: 0 auto; overflow: hidden; border-radius: 14px; }
  #stage { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; transform-origin: 0 0; background: radial-gradient(1200px 500px at 50% -200px, #1f1e1c, var(--bg));
    color: var(--text); font-size: 14px; overflow: hidden; outline: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .i { flex: none; display: block; }
  ::-webkit-scrollbar { width: 0; }
  kbd { font: 500 10.5px/1 'Geist Mono', monospace; color: var(--faint); border: 1px solid var(--line2); border-radius: 4px; padding: 2px 5px; }

  .av { position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 600; flex: none; }
  .av.grp { border-radius: 30%; }
  .netb { position: absolute; right: -3px; bottom: -3px; width: 15px; height: 15px; border-radius: 5px; font-size: 9px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--bg); }
  .netb.inline { position: static; box-shadow: none; display: inline-flex; border-radius: 4px; }

  .corner { position: absolute; top: 20px; display: flex; align-items: center; gap: 10px; }
  .corner.l { left: 24px; }
  .corner.r { right: 24px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: #0284c7; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .health { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .health .dots { display: flex; gap: 3px; }
  .health .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .health .dots i.w { background: var(--warn); }
  .meav { width: 30px; height: 30px; border-radius: 50%; background: #44403c; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }

  .col { position: absolute; left: 50%; transform: translateX(-50%); top: 72px; bottom: 0; width: 760px; display: flex; flex-direction: column; }

  /* omnibar */
  .omni { position: relative; z-index: 5; }
  .bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 54px; padding: 8px 12px 8px 16px; background: var(--surf); border: 1px solid var(--line2); border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35); color: var(--faint); cursor: text; }
  .bar:focus-within { border-color: #4b6b7d; box-shadow: 0 0 0 4px rgba(125,211,252,.08), 0 10px 40px rgba(0,0,0,.35); }
  .tok { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 6px 0 9px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font: 500 12.5px 'Geist Mono', monospace; }
  .tok .k { color: #5aa8cc; }
  .tok button { width: 18px; height: 18px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #5aa8cc; }
  .tok button:hover { background: rgba(125,211,252,.18); color: var(--accent); }
  .bar input { flex: 1; min-width: 200px; height: 36px; border: 0; outline: none; background: none; color: var(--text); font: inherit; font-size: 15px; }
  .bar input::placeholder { color: var(--faint); }
  .bar .hint { display: flex; gap: 4px; }
  .sug { position: absolute; left: 0; right: 0; top: calc(100% + 8px); background: var(--raise); border: 1px solid var(--line2); border-radius: 14px; padding: 6px; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
  .sug[hidden] { display: none; }
  .sug .g { font-size: 11px; color: var(--faint); padding: 9px 10px 4px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .sug .it { display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 10px; border-radius: 9px; cursor: pointer; color: var(--dim); }
  .sug .it.on { background: var(--raise2); color: var(--text); }
  .sug .it .mono { font: 500 13px 'Geist Mono', monospace; color: var(--accent); }
  .sug .it .d { color: var(--faint); font-size: 12.5px; }
  .sug .it .r { margin-left: auto; font-size: 12px; color: var(--faint); }
  .sug .ft { padding: 8px 10px 4px; border-top: 1px solid var(--line); margin-top: 4px; font-size: 11.5px; color: var(--faint); display: flex; gap: 14px; }
  .sug .ft code { font-family: 'Geist Mono', monospace; color: var(--dim); }

  .views { display: flex; gap: 6px; margin: 14px 0 6px; flex-wrap: wrap; }
  .view { height: 30px; padding: 0 12px; border-radius: 15px; color: var(--dim); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; }
  .view:hover { color: var(--text); background: var(--surf); }
  .view.on { color: var(--text); background: var(--raise); border-color: var(--line2); }
  .view .n { font-size: 11.5px; color: var(--faint); }
  .view.on .n { color: var(--accent); }
  .view.save { color: var(--faint); border: 1px dashed var(--line2); }

  .scroll { flex: 1; overflow-y: auto; padding: 8px 0 40px; }

  /* needs-you strip */
  .need { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; margin: 6px 0 4px; border-radius: 14px; background: linear-gradient(90deg, rgba(125,211,252,.09), rgba(125,211,252,.03)); border: 1px solid rgba(125,211,252,.22); }
  .need .x { flex: 1; min-width: 0; }
  .need .h { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .need .h b { color: var(--text); font-weight: 600; }
  .need .q { margin-top: 6px; font-size: 14.5px; line-height: 1.45; }
  .need textarea { width: 100%; margin-top: 6px; background: var(--bg); border: 1px solid #4b6b7d; color: var(--text); border-radius: 9px; padding: 8px 10px; font: inherit; resize: none; outline: none; }
  .need .btns { display: flex; gap: 6px; margin-top: 10px; }
  .btn { height: 30px; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
  .btn.pri { background: var(--accent); color: var(--accent-ink); }
  .btn.pri:hover { background: #bae6fd; }
  .btn.sec { background: var(--raise2); }
  .btn.sec:hover { background: #34312d; }
  .btn.ghost { color: var(--dim); }
  .btn.ghost:hover { color: var(--text); }

  .grp-h { font-size: 11.5px; color: var(--faint); padding: 18px 4px 8px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .grp-h::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .item { border-radius: 14px; margin-bottom: 2px; border: 1px solid transparent; }
  .item.open { background: var(--surf); border-color: var(--line); margin: 8px 0; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
  .rowc { position: relative; display: flex; align-items: center; gap: 13px; padding: 11px 14px; border-radius: 13px; cursor: pointer; }
  .item:not(.open) .rowc:hover { background: var(--surf); }
  .item.kb:not(.open) .rowc { background: var(--surf); box-shadow: inset 0 0 0 1px var(--line2); }
  .rowc .mid { flex: 1; min-width: 0; }
  .rowc .l1 { display: flex; align-items: baseline; gap: 8px; }
  .rowc .nm { font-weight: 600; }
  .item.read .nm { font-weight: 500; color: var(--dim); }
  .rowc .net { font-size: 12px; color: var(--faint); }
  .rowc .pv { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .item.read .pv { color: var(--faint); }
  .rowc .tm { font-size: 12px; color: var(--faint); flex: none; }
  .pill { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .pill.muted { background: var(--raise2); color: var(--faint); }
  .tagl { font-size: 11px; padding: 0 6px; border-radius: 4px; line-height: 17px; }
  .acts { display: none; gap: 2px; margin-left: 4px; }
  .item:not(.open) .rowc:hover .acts { display: flex; }
  .item:not(.open) .rowc:hover .tm, .item:not(.open) .rowc:hover .pill { display: none; }
  .acts button { height: 28px; padding: 0 9px; border-radius: 7px; color: var(--dim); font-size: 12.5px; display: flex; align-items: center; gap: 5px; }
  .acts button:hover { background: var(--raise2); color: var(--text); }

  .thread { padding: 4px 18px 0 63px; display: flex; flex-direction: column; gap: 2px; max-height: 300px; overflow-y: auto; }
  .m { max-width: 80%; display: flex; flex-direction: column; }
  .m.them { align-self: flex-start; }
  .m.me { align-self: flex-end; align-items: flex-end; }
  .m .who { font-size: 12px; color: var(--dim); margin: 8px 0 2px 2px; font-weight: 500; }
  .bub { padding: 7px 12px; border-radius: 14px; background: var(--raise2); line-height: 1.42; }
  .m.me .bub { background: #1e3a4a; color: #e0f2fe; }
  .m .meta { font-size: 11px; color: var(--faint); margin: 3px 4px 6px; display: flex; gap: 5px; align-items: center; }
  .m .meta .by { color: var(--accent); display: inline-flex; gap: 3px; align-items: center; }
  .st { display: inline-flex; align-items: center; gap: 4px; }
  .st.read { color: var(--accent); }
  .st.unknown { color: var(--warn); font-weight: 500; }
  .fix { color: var(--warn); text-decoration: underline; text-underline-offset: 2px; font-size: 11px; }
  .media { width: 200px; height: 130px; border-radius: 12px; background: linear-gradient(135deg, #57534e, #292524); display: flex; align-items: center; justify-content: center; color: var(--faint); }
  .rx { display: flex; gap: 4px; margin-top: 2px; }
  .rx span { background: var(--raise); border: 1px solid var(--line2); border-radius: 10px; padding: 0 6px; font-size: 11.5px; }

  .reply { margin: 10px 14px 0 63px; display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line2); border-radius: 12px; padding: 4px 4px 4px 12px; }
  .reply:focus-within { border-color: #4b6b7d; }
  .reply input { flex: 1; height: 34px; border: 0; outline: none; background: none; color: var(--text); font: inherit; }
  .reply input::placeholder { color: var(--faint); }
  .ib { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--faint); }
  .ib:hover { background: var(--raise2); color: var(--text); }
  .ib.ai { color: var(--accent); }
  .ib.send { background: var(--accent); color: var(--accent-ink); }
  .foot { display: flex; align-items: center; gap: 2px; padding: 8px 14px 12px 57px; }
  .foot button { height: 28px; padding: 0 8px; border-radius: 7px; color: var(--faint); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .foot button:hover { color: var(--text); background: var(--raise); }
  .foot button.on { color: var(--accent); }
  .foot .sp { flex: 1; }
  .foot .info { font-size: 11.5px; color: var(--faint); display: flex; gap: 5px; align-items: center; }
  .empty { padding: 70px 20px; text-align: center; color: var(--faint); }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; font-weight: 600; }

  .menu { position: absolute; z-index: 8; width: 240px; background: var(--raise); border: 1px solid var(--line2); border-radius: 12px; padding: 5px; box-shadow: 0 20px 50px rgba(0,0,0,.55); }
  .menu[hidden] { display: none; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; text-align: left; }
  .menu button:hover { background: var(--raise2); }
  .menu .w { margin-left: auto; color: var(--faint); font-size: 12px; }
  .toast { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--text); color: #1c1917; border-radius: 11px; height: 40px; padding: 0 6px 0 16px; display: flex; align-items: center; gap: 12px; font-weight: 500; box-shadow: 0 12px 30px rgba(0,0,0,.4); z-index: 9; white-space: nowrap; }
  .toast[hidden] { display: none; }
  .toast button { height: 28px; padding: 0 10px; border-radius: 7px; font-weight: 600; color: #0369a1; }
  .toast button:hover { background: #e7e5e4; }
</style>
</head>
<body>
<div class="backbar"><a class="back" href="index.html">← All prototypes</a></div>
<div id="wrap"><div id="stage" tabindex="0">
  <div class="corner l"><span class="logo">T</span></div>
  <div class="corner r"><div class="health" id="health"></div><div class="meav">IC</div></div>
  <div class="col">
    <div class="omni">
      <div class="bar" id="bar"><span id="toks" style="display:contents"></span><input id="q" autocomplete="off" spellcheck="false"><span class="hint"><kbd>/</kbd></span></div>
      <div class="sug" id="sug" hidden></div>
    </div>
    <div class="views" id="views"></div>
    <div class="scroll" id="scroll"></div>
  </div>
  <div class="menu" id="menu" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div></div>

<script src="shared.js"></script>
<script>
const chats = makeChats();
const $ = (id) => document.getElementById(id);
const stage = $('stage');
fitStage($('wrap'), stage, 1280, 800);
$('bar').insertAdjacentHTML('afterbegin', icon('search', 18));

const healthy = Object.keys(NETS).filter((k) => k !== 'ai');
$('health').innerHTML = `<span class="dots">${healthy.map((k) => `<i class="${NETS[k].health ? 'w' : ''}" title="${NETS[k].name}${NETS[k].health ? `: ${NETS[k].health}` : ': connected'}"></i>`).join('')}</span>${netBadge('gm', 14)} phone offline`;

const NET_ALIASES = { whatsapp: 'wa', signal: 'sg', sms: 'gm', gmessages: 'gm', google: 'gm', telegram: 'tg', messenger: 'fb', instagram: 'ig', discord: 'dc', agents: 'ai' };
const netSlug = (k) => Object.keys(NET_ALIASES).find((a) => NET_ALIASES[a] === k);

// token = { k: 'in'|'is'|'label', v }
const TOKEN_DEFS = [
  ...Object.keys(NETS).map((k) => ({ k: 'in', v: netSlug(k), d: `${NETS[k].name} chats`, net: k })),
  { k: 'is', v: 'unread', d: 'Has unread messages' },
  { k: 'is', v: 'pinned', d: 'Pinned chats' },
  { k: 'is', v: 'muted', d: 'Muted chats' },
  { k: 'is', v: 'request', d: 'Message requests from strangers' },
  { k: 'is', v: 'group', d: 'Group chats' },
  { k: 'is', v: 'done', d: 'Chats you marked done' },
  { k: 'has', v: 'mention', d: 'Someone @mentioned you' },
  { k: 'has', v: 'media', d: 'Photos, video, files' },
  ...Object.keys(LABELS).map((l) => ({ k: 'label', v: l.toLowerCase(), d: `Labeled ${l}` })),
];

const VIEWS = [
  { name: 'Everything', toks: [] },
  { name: 'Needs reply', toks: [{ k: 'is', v: 'unread' }] },
  { name: 'Family', toks: [{ k: 'label', v: 'family' }] },
  { name: 'Work', toks: [{ k: 'label', v: 'work' }] },
  { name: 'Agents', toks: [{ k: 'in', v: 'agents' }] },
  { name: 'Requests', toks: [{ k: 'is', v: 'request' }] },
];

let toks = [];
let open = null;
let kb = null;
let sIndex = 0;
let sItems = [];
let undo = null;

const byId = (id) => chats.find((c) => c.id === id);
const sameToks = (a, b) => a.length === b.length && a.every((t, i) => t.k === b[i].k && t.v === b[i].v);

function matchTok(c, t) {
  if (t.k === 'in') return c.net === NET_ALIASES[t.v];
  if (t.k === 'label') return (c.labels || []).some((l) => l.toLowerCase() === t.v);
  if (t.k === 'has') return t.v === 'mention' ? !!c.mention : c.msgs.some((m) => m.media);
  if (t.k === 'is') {
    if (t.v === 'unread') return (c.unread > 0 && !c.muted) || (c.id === open && c.wasUnread);
    if (t.v === 'pinned') return !!c.pinned;
    if (t.v === 'muted') return !!c.muted;
    if (t.v === 'request') return !!c.request;
    if (t.v === 'group') return !!c.group;
    if (t.v === 'done') return !!c.done;
  }
  return true;
}
// Free-text part of the query: half-typed filters and commands don't count as search words.
function searchText(text) {
  if (text.trim().startsWith('>')) return '';
  return text.trim().toLowerCase().split(/\s+/).filter((w) => w && !/^(in|is|has|label):/.test(w)).join(' ');
}
function visible(tokens = toks, text = $('q').value) {
  const q = searchText(text);
  const wantsDone = tokens.some((t) => t.k === 'is' && t.v === 'done');
  const wantsReq = tokens.some((t) => t.k === 'is' && t.v === 'request');
  return chats.filter((c) => (wantsDone || !c.done) && !c.snoozed && (wantsReq || !c.request)
    && tokens.every((t) => matchTok(c, t))
    && (!q || c.name.toLowerCase().includes(q) || c.msgs.some((m) => (m.text || '').toLowerCase().includes(q))));
}

function renderToks() {
  $('toks').innerHTML = toks.map((t, i) => `<span class="tok"><span class="k">${t.k}:</span>${esc(t.v)}<button data-untok="${i}" title="Remove">${icon('x', 12)}</button></span>`).join('');
  $('q').placeholder = toks.length ? 'Add more filters or search…' : 'Search, filter with in: is: label:, or type > for commands';
}

function renderViews() {
  const custom = VIEWS.some((v) => sameToks(v.toks, toks));
  $('views').innerHTML = VIEWS.map((v, i) => {
    const n = v.toks.length ? visible(v.toks, '').filter((c) => c.unread && !c.muted).length : '';
    return `<button class="view${sameToks(v.toks, toks) ? ' on' : ''}" data-view="${i}">${esc(v.name)}${n ? `<span class="n">${n}</span>` : ''}</button>`;
  }).join('') + (custom ? '' : `<button class="view save" data-act="save">${icon('plus', 13)} Save view</button>`);
}

function msgHTML(c, m, i) {
  const prev = c.msgs[i - 1];
  const side = m.from === 'me' ? 'me' : 'them';
  const who = c.group && side === 'them' && (!prev || prev.from !== m.from) ? `<div class="who">${esc(m.from)}</div>` : '';
  const body = m.media ? `<div class="media">${icon('eye', 20)}</div>` : `<div class="bub">${esc(m.text)}</div>`;
  const rx = m.reactions ? `<div class="rx">${Object.entries(m.reactions).map(([e, n]) => `<span>${e} ${n}</span>`).join('')}</div>` : '';
  const fix = m.status === 'unknown' ? `<button class="fix" data-fix="${c.id}:${i}">Check again</button>` : '';
  const by = m.by ? `<span class="by">${icon('sparkle', 11)} ${m.by}</span>` : '';
  return `<div class="m ${side}">${who}${body}${rx}<div class="meta">${by}${m.t}${side === 'me' ? statusHTML(m.status) : ''}${fix}</div></div>`;
}

function itemHTML(c) {
  const isOpen = open === c.id;
  const net = NETS[c.net];
  const lbls = (c.labels || []).map((l) => `<span class="tagl" style="color:${LABELS[l]};background:${LABELS[l]}1f">${l}</span>`).join('');
  const msgs = c.msgs.filter((m) => m.kind !== 'approval');
  const head = `<div class="rowc" data-open="${c.id}">${avatar(c, 38)}
    <div class="mid"><div class="l1"><span class="nm">${esc(c.name)}</span><span class="net">${c.agent ? 'Agent' : net.name}</span>${c.muted ? `<span style="color:var(--faint)">${icon('mute', 12)}</span>` : ''}${lbls}</div>
    ${isOpen ? '' : `<div class="pv">${esc(preview(c))}</div>`}</div>
    <span class="tm">${c.time}</span>${!isOpen && c.unread ? `<span class="pill${c.muted ? ' muted' : ''}">${c.mention ? '@' : c.unread}</span>` : ''}
    ${isOpen ? `<button class="ib" data-close title="Collapse (Esc)">${icon('down', 16)}</button>` : `<span class="acts"><button data-done="${c.id}">${icon('done', 14)} Done</button><button data-snz="${c.id}">${icon('snooze', 14)} Later</button></span>`}</div>`;
  if (!isOpen) return `<div class="item${c.unread ? '' : ' read'}${kb === c.id ? ' kb' : ''}" data-item="${c.id}">${head}</div>`;
  const indexed = c.msgs.map((m, i) => [m, i]).filter(([m]) => m.kind !== 'approval');
  return `<div class="item open" data-item="${c.id}">${head}
    <div class="thread" id="thread">${indexed.map(([m, i]) => msgHTML(c, m, i)).join('')}</div>
    ${c.request
      ? `<div class="foot" style="padding-left:63px"><span class="info" style="flex:1">${icon('user', 13)} Not in your ${net.name} contacts</span><button data-act="block">Block</button><button class="on" data-act="accept">${icon('check', 14)} Accept</button></div>`
      : `<div class="reply"><input id="rin" placeholder="${c.agent ? `Message ${esc(c.name)}` : `Reply on ${net.name}`}" value="${esc(c.draft || '')}" autocomplete="off">${dotsCanDraft(c) ? `<button class="ib ai" data-act="draft" title="Draft with Dots">${icon('sparkle', 16)}</button>` : ''}<button class="ib send" data-act="send" title="Send (Enter)">${icon('send', 16)}</button></div>
      <div class="foot">
        <button data-done="${c.id}">${icon('done', 14)} Done</button>
        <button data-snz="${c.id}">${icon('snooze', 14)} Later</button>
        <button data-act="mute" class="${c.muted ? 'on' : ''}">${icon(c.muted ? 'mute' : 'bell', 14)} ${c.muted ? 'Muted' : 'Mute'}</button>
        <button data-act="label">${icon('tag', 14)} Label</button>
        <span class="sp"></span>
        <span class="info">${c.agent ? `${icon('lock', 12)} ${esc(c.access)}` : `${icon('lock', 12)} Sealed · ${dotsCanDraft(c) ? 'Dots can draft here' : 'no agent access'}`}</span>
      </div>`}
  </div>`;
}

function needHTML() {
  const dots = byId('dots');
  const idx = dots.msgs.findIndex((m) => m.kind === 'approval' && ['pending', 'editing'].includes(m.approval.state));
  if (idx < 0) return '';
  const a = dots.msgs[idx].approval;
  const to = byId(a.to);
  const editing = a.state === 'editing';
  return `<div class="need">${avatar(dots, 34)}
    <div class="x"><div class="h"><b>Dots</b> wants to reply to ${avatar(to, 18, false)} <b>${esc(to.name)}</b> on ${netBadge(to.net)} ${NETS[to.net].name}</div>
      ${editing ? `<textarea id="aedit" rows="2">${esc(a.edit ?? a.text)}</textarea>` : `<div class="q">“${esc(a.text)}”</div>`}
      <div class="btns"><button class="btn pri" data-ap="approve" data-i="${idx}">${icon('check', 14)} ${editing ? 'Send edited' : 'Approve & send'}</button>${editing ? '' : `<button class="btn sec" data-ap="edit" data-i="${idx}">Edit</button>`}<button class="btn ghost" data-ap="reject" data-i="${idx}">Reject</button></div></div></div>`;
}

// A chat stays in "Needs reply" while it's open, even though opening it clears the unread count.
const needsReply = (c) => !c.done && ((c.unread && !c.muted) || (c.id === open && c.wasUnread));

function renderList() {
  const focus = captureFocus();
  const list = visible();
  const needs = list.filter(needsReply);
  const rest = list.filter((c) => !needs.includes(c));
  const showNeed = !toks.length && !$('q').value.trim();
  let html = showNeed ? needHTML() : '';
  if (!list.length) html += `<div class="empty"><b>Nothing here</b>Try removing a filter.</div>`;
  if (needs.length) html += `<div class="grp-h">Needs reply · ${needs.length}</div>${needs.map(itemHTML).join('')}`;
  if (rest.length) html += `<div class="grp-h">${needs.length ? 'Earlier' : 'Chats'}</div>${rest.map(itemHTML).join('')}`;
  $('scroll').innerHTML = html;
  const th = $('thread');
  if (th) th.scrollTop = th.scrollHeight;
  restoreFocus(focus);
}

function render() { renderToks(); renderViews(); renderList(); }

function toggleOpen(id) {
  open = open === id ? null : id;
  kb = id;
  const c = byId(id);
  if (open && c && !c.muted) { c.wasUnread = c.unread > 0; c.unread = 0; c.mention = false; }
  closeMenu();
  render();
  if (open) {
    $('rin')?.focus({ preventScroll: true });
    document.querySelector('.item.open')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

/* suggestions */
function suggestions() {
  const raw = $('q').value;
  const q = raw.trim().toLowerCase();
  if (q.startsWith('>')) {
    const cq = q.slice(1).trim();
    const o = open && byId(open);
    const cmds = [
      ...(o ? [
        { g: `For ${o.name}`, lb: o.muted ? 'Unmute' : 'Mute', ic: 'mute', run: () => toggleMute(o) },
        { g: `For ${o.name}`, lb: 'Mark done', ic: 'done', run: () => markDone(o.id) },
        { g: `For ${o.name}`, lb: 'Snooze until tomorrow', ic: 'snooze', run: () => snooze(o.id, 'tomorrow 9 AM') },
      ] : []),
      { g: 'Commands', lb: 'Mark everything visible as read', ic: 'eye', run: () => { visible(toks, '').forEach((c) => { if (!c.muted) c.unread = 0; c.mention = false; }); toast('Marked as read'); } },
      { g: 'Commands', lb: 'New message', ic: 'pencil', r: 'pick person, then network', run: () => toast('New message: pick a person, then a network') },
      { g: 'Commands', lb: 'Connect a network', ic: 'plus', run: () => toast('Opens the shared login stepper for any network') },
      { g: 'Commands', lb: 'Ask Dots for a summary of today', ic: 'sparkle', run: () => toast('Dots will post a summary in its thread') },
      { g: 'Commands', lb: 'Save these filters as a view', ic: 'tag', run: saveView },
    ];
    return cmds.filter((c) => !cq || c.lb.toLowerCase().includes(cq));
  }
  if (!q) {
    return [
      { g: 'Try a filter', mono: 'is:unread', d: 'Has unread messages', tok: { k: 'is', v: 'unread' } },
      { g: 'Try a filter', mono: 'in:whatsapp', d: 'One network', tok: { k: 'in', v: 'whatsapp' } },
      { g: 'Try a filter', mono: 'label:family', d: 'One label', tok: { k: 'label', v: 'family' } },
      { g: 'Try a filter', mono: '>', d: 'Run a command', cmd: true },
    ];
  }
  const last = q.split(/\s+/).pop();
  const tokMatches = TOKEN_DEFS.filter((t) => `${t.k}:${t.v}`.startsWith(last) || (last.length > 1 && (t.v.startsWith(last) || (t.net && NETS[t.net].name.toLowerCase().startsWith(last)))))
    .filter((t) => !toks.some((x) => x.k === t.k && x.v === t.v))
    .slice(0, 5)
    .map((t) => ({ g: 'Filters', mono: `${t.k}:${t.v}`, d: t.d, tok: { k: t.k, v: t.v }, net: t.net }));
  const st = searchText(raw);
  const people = (st ? chats.filter((c) => c.name.toLowerCase().includes(st)) : []).slice(0, 4).map((c) => ({ g: 'Open', av: c, lb: c.name, r: c.agent ? 'Agent' : NETS[c.net].name, run: () => { $('q').value = ''; toggleOpenAt(c.id); } }));
  const n = visible().length;
  return [...tokMatches, ...people, ...(st ? [{ g: 'Search', ic: 'search', lb: `Messages containing “${st}”`, r: `${n} chat${n === 1 ? '' : 's'}`, run: () => {} }] : [])];
}
function toggleOpenAt(id) { open = null; toggleOpen(id); }

function renderSug() {
  const box = $('sug');
  if (document.activeElement !== $('q')) { box.hidden = true; return; }
  sItems = suggestions();
  sIndex = Math.min(sIndex, sItems.length - 1);
  let g = '';
  box.innerHTML = sItems.map((s, i) => {
    const head = s.g !== g ? `<div class="g">${esc((g = s.g))}</div>` : '';
    const lead = s.av ? avatar(s.av, 22, false) : s.net ? netBadge(s.net, 18) : s.mono ? `<span style="width:18px;display:flex;justify-content:center;color:var(--faint)">${icon(s.cmd ? 'bolt' : 'sliders', 15)}</span>` : icon(s.ic, 16);
    const label = s.mono ? `<span class="mono">${esc(s.mono)}</span><span class="d">${esc(s.d)}</span>` : `<span>${esc(s.lb)}</span>`;
    return `${head}<div class="it${i === sIndex ? ' on' : ''}" data-si="${i}">${lead}${label}${s.r ? `<span class="r">${esc(s.r)}</span>` : ''}</div>`;
  }).join('') + `<div class="ft"><span><kbd>↑↓</kbd> choose</span><span><kbd>↵</kbd> apply</span><span><kbd>⌫</kbd> remove last filter</span><span>Combine: <code>in:signal is:unread climbing</code></span></div>`;
  box.hidden = !sItems.length;
}

function applySug(i) {
  const s = sItems[i];
  if (!s) return;
  const input = $('q');
  if (s.cmd) { input.value = '>'; sIndex = 0; renderSug(); return; }
  if (s.tok) {
    const words = input.value.trim().split(/\s+/);
    if (words.length && (`${s.tok.k}:${s.tok.v}`.startsWith(words[words.length - 1].toLowerCase()) || s.tok.v.startsWith(words[words.length - 1].toLowerCase()) || s.net)) words.pop();
    input.value = words.join(' ');
    toks.push(s.tok);
    sIndex = 0;
    render();
    renderSug();
    return;
  }
  input.value = input.value.trim().startsWith('>') ? '' : input.value;
  s.run();
  if (s.g !== 'Search') input.blur();
  render();
}

// Typing "in:signal " turns into a filter chip.
function tokenizeTyped() {
  const input = $('q');
  const m = input.value.match(/(?:^|\s)(in|is|has|label):([a-z]+)\s$/i);
  if (!m) return;
  const t = { k: m[1].toLowerCase(), v: m[2].toLowerCase() };
  if (!TOKEN_DEFS.some((d) => d.k === t.k && d.v === t.v)) return;
  input.value = input.value.slice(0, input.value.length - m[0].length).trimEnd();
  if (!toks.some((x) => x.k === t.k && x.v === t.v)) toks.push(t);
  render();
}

/* actions */
function toast(text, undoFn) {
  undo = undoFn;
  const t = $('toast');
  t.innerHTML = `<span>${text}</span>${undoFn ? '<button id="undo">Undo</button>' : ''}`;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; undo = null; }, 3800);
}
function markDone(id) {
  const c = byId(id);
  c.done = !c.done;
  c.unread = 0;
  if (open === id) open = null;
  toast(c.done ? `Marked <b>${esc(c.name)}</b> done` : `Moved ${esc(c.name)} back`, c.done ? () => { c.done = false; } : null);
  render();
}
function snooze(id, when) {
  const c = byId(id);
  c.snoozed = true;
  if (open === id) open = null;
  closeMenu();
  toast(`<b>${esc(c.name)}</b> comes back ${when}`, () => { c.snoozed = false; });
  render();
}
function toggleMute(c) {
  c.muted = !c.muted;
  toast(c.muted ? `Muted ${esc(c.name)}` : `Unmuted ${esc(c.name)}`);
  render();
}
function saveView() {
  if (!toks.length) return toast('Add a filter first, then save it as a view');
  const name = toks.map((t) => t.v[0].toUpperCase() + t.v.slice(1)).join(' + ');
  VIEWS.push({ name, toks: toks.map((t) => ({ ...t })) });
  toast(`Saved view “${esc(name)}”`);
  render();
}
function sendFrom(c, text, by) {
  const m = { from: 'me', text, t: nowTime(), by };
  c.msgs.push(m);
  c.time = m.t;
  simulateSend(m, renderList);
}
function send() {
  const c = byId(open);
  const input = $('rin');
  if (!c || !input || !input.value.trim()) return;
  sendFrom(c, input.value.trim(), c.draftAi ? 'drafted by Dots' : null);
  c.draft = '';
  c.draftAi = false;
  renderList();
  $('rin')?.focus();
}

function closeMenu() { $('menu').hidden = true; }
function openMenu(kind, anchor, id) {
  const c = byId(id);
  const m = $('menu');
  m.innerHTML = kind === 'snooze'
    ? [['later today', '6:00 PM'], ['tomorrow 9 AM', 'Thu'], ['this weekend', 'Sat'], ['next week', 'Mon']].map(([w, r]) => `<button data-snzw="${w}" data-cid="${id}">${icon('snooze', 15)} ${w[0].toUpperCase() + w.slice(1)}<span class="w">${r}</span></button>`).join('')
    : Object.keys(LABELS).map((l) => `<button data-lab="${l}" data-cid="${id}"><span style="width:9px;height:9px;border-radius:3px;background:${LABELS[l]}"></span>${l}${(c.labels || []).includes(l) ? `<span class="w" style="color:var(--accent)">${icon('check', 14)}</span>` : ''}</button>`).join('');
  const sr = stage.getBoundingClientRect();
  const s = sr.width / 1280;
  const ar = anchor.getBoundingClientRect();
  m.style.left = `${(ar.left - sr.left) / s}px`;
  const top = (ar.bottom - sr.top) / s + 6;
  m.style.top = `${top + 170 > 800 ? (ar.top - sr.top) / s - 6 - (kind === 'snooze' ? 148 : 112) : top}px`;
  m.hidden = false;
}

stage.addEventListener('mousedown', (e) => {
  if (e.target.closest('#sug')) e.preventDefault();
});

stage.addEventListener('click', (e) => {
  const t = e.target.closest('[data-untok],[data-view],[data-si],[data-open],[data-close],[data-done],[data-snz],[data-snzw],[data-lab],[data-ap],[data-act],[data-fix],#undo,#bar');
  if (!e.target.closest('#menu,[data-snz],[data-act="label"]')) closeMenu();
  if (!t) return;
  const d = t.dataset;
  if (t.id === 'undo') { undo && undo(); undo = null; $('toast').hidden = true; return render(); }
  if (d.untok !== undefined) { toks.splice(+d.untok, 1); render(); return $('q').focus(); }
  if (d.si !== undefined) return applySug(+d.si);
  if (t.id === 'bar') return $('q').focus();
  if (d.view !== undefined) { toks = VIEWS[+d.view].toks.map((x) => ({ ...x })); $('q').value = ''; open = null; return render(); }
  if (d.close !== undefined) { open = null; return render(); }
  if (d.done) { e.stopPropagation(); return markDone(d.done); }
  if (d.snz) { e.stopPropagation(); return openMenu('snooze', t, d.snz); }
  if (d.snzw) return snooze(d.cid, d.snzw);
  if (d.lab) {
    const c = byId(d.cid);
    c.labels = c.labels || [];
    c.labels = c.labels.includes(d.lab) ? c.labels.filter((x) => x !== d.lab) : [...c.labels, d.lab];
    if (!dotsCanDraft(c) && revokeApprovals(chats, c.id)) toast(`Dots lost access to ${esc(c.name)}, so its pending draft was discarded`);
    closeMenu();
    return render();
  }
  if (d.fix) {
    const [cid, i] = d.fix.split(':');
    const m = byId(cid).msgs[+i];
    m.status = 'checking';
    renderList();
    setTimeout(() => { m.status = 'delivered'; renderList(); toast('Confirmed delivered. No resend needed.'); }, 1100);
    return;
  }
  if (d.ap) {
    const dots = byId('dots');
    const a = dots.msgs[+d.i].approval;
    if (d.ap === 'edit') { a.state = 'editing'; renderList(); return $('aedit').focus(); }
    if (d.ap === 'reject') { a.state = 'rejected'; dots.unread = 0; toast('Rejected. Dots was told it was blocked.'); return render(); }
    const to = byId(a.to);
    if (!dotsCanDraft(to)) { a.state = 'revoked'; dots.unread = 0; toast(`Discarded. Dots no longer has access to ${esc(to.name)}`); return render(); }
    if (a.state === 'editing') {
      const text = (a.edit ?? a.text).trim();
      if (!text) { toast('The message is empty. Write something, or reject the draft.'); return $('aedit').focus(); }
      a.text = text;
    }
    a.state = 'sent';
    dots.unread = 0;
    sendFrom(to, a.text, 'sent by Dots');
    to.unread = 0;
    toast(`Sent to <b>${esc(to.name)}</b> on ${NETS[to.net].name}`);
    return render();
  }
  if (d.open) return toggleOpen(d.open);
  const c = byId(open);
  const act = d.act;
  if (act === 'send') return send();
  if (act === 'draft') {
    if (!dotsCanDraft(c)) return toast(`Dots doesn't have access to ${esc(c.name)}`);
    c.draft = DRAFTS[c.id] || 'Sounds good!';
    c.draftAi = true;
    renderList();
    return $('rin').focus();
  }
  if (act === 'mute') return toggleMute(c);
  if (act === 'label') return $('menu').hidden ? openMenu('label', t, c.id) : closeMenu();
  if (act === 'save') return saveView();
  if (act === 'accept') { c.request = false; toast(`Accepted ${esc(c.name)}`); return render(); }
  if (act === 'block') { c.request = false; c.done = true; open = null; toast(`Blocked ${esc(c.name)}`); return render(); }
});

stage.addEventListener('focusin', (e) => { if (e.target.id === 'q') { sIndex = 0; renderSug(); } });
stage.addEventListener('focusout', (e) => { if (e.target.id === 'q') setTimeout(renderSug, 0); });
stage.addEventListener('input', (e) => {
  if (e.target.id === 'q') { tokenizeTyped(); sIndex = 0; renderViews(); renderList(); renderSug(); }
  if (e.target.id === 'rin') { const c = byId(open); c.draft = e.target.value; if (!c.draft) c.draftAi = false; }
  if (e.target.id === 'aedit') byId('dots').msgs.find((m) => m.kind === 'approval').approval.edit = e.target.value;
});

document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t.id === 'q') {
    if (e.key === 'ArrowDown') { e.preventDefault(); sIndex = Math.min(sItems.length - 1, sIndex + 1); return renderSug(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sIndex = Math.max(0, sIndex - 1); return renderSug(); }
    if (e.key === 'Enter' || e.key === 'Tab') { if (sItems.length && !(e.key === 'Tab' && !t.value)) { e.preventDefault(); applySug(sIndex); } return; }
    if (e.key === 'Backspace' && !t.value && toks.length) { toks.pop(); render(); renderSug(); return; }
    if (e.key === 'Escape') { if (t.value) { t.value = ''; render(); renderSug(); } else { t.blur(); stage.focus(); } return; }
    return;
  }
  if (t.id === 'rin') {
    if (e.key === 'Enter') { e.preventDefault(); return send(); }
    if (e.key === 'Escape') { open = null; render(); stage.focus(); }
    return;
  }
  if (isTyping(e)) {
    if (t.id === 'aedit' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) document.querySelector('[data-ap="approve"]')?.click();
    return;
  }
  if (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); return $('q').focus(); }
  if (e.key === 'Escape') { closeMenu(); if (open) { open = null; render(); } return; }
  const list = visible();
  const order = [...list.filter(needsReply), ...list.filter((c) => !needsReply(c))];
  if (e.key === 'j' || e.key === 'k' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const dir = e.key === 'j' || e.key === 'ArrowDown' ? 1 : -1;
    const i = order.findIndex((c) => c.id === kb);
    kb = order[Math.max(0, Math.min(order.length - 1, i < 0 ? 0 : i + dir))]?.id;
    renderList();
    document.querySelector('.item.kb')?.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (e.key === 'Enter' && kb) { e.preventDefault(); return toggleOpen(kb); }
  if (e.key === 'e' && (open || kb)) return markDone(open || kb);
});

render();
toggleOpen('mom');
$('rin')?.blur();
stage.focus({ preventScroll: true });
</script>
</body>
</html>
