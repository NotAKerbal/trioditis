<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file:" />
    <title>Connect to a server</title>
    <link rel="stylesheet" href="connect.css" />
  </head>
  <body>
    <main>
      <svg class="mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <clipPath id="trioditis-tile"><rect width="64" height="64" rx="14" /></clipPath>
        <rect width="64" height="64" rx="14" fill="#0284c7" />
        <g clip-path="url(#trioditis-tile)" fill="none" stroke="#ffffff" stroke-width="7">
          <path d="M37 -4C37 14 30 20 30 34" />
          <path d="M-4 31C10 31 18 32 30 34" />
          <path d="M61 68C56 52 41 47 30 34" />
        </g>
        <circle cx="30" cy="34" r="10.5" fill="#ffffff" />
        <circle cx="30" cy="34" r="4.5" fill="#0284c7" />
      </svg>
      <h1>Connect to your server</h1>
      <p class="lead">Enter the address you open Trioditis at in a browser.</p>
      <form id="form" novalidate>
        <label for="address">Server address</label>
        <input
          id="address"
          name="address"
          type="text"
          inputmode="url"
          autocomplete="url"
          spellcheck="false"
          placeholder="https://trioditis.example.com"
          required
          autofocus
        />
        <p id="error" class="error" role="alert" hidden></p>
        <div class="actions">
          <button id="cancel" type="button" class="secondary" hidden>Cancel</button>
          <button id="submit" type="submit">Connect</button>
        </div>
      </form>
    </main>
    <script src="connect.js"></script>
  </body>
</html>
