# Installers for the desktop app (docs/CONTRIBUTING.md, The desktop app). The app ships only its
# main process, preload and server picker: the web app comes from the server it connects to, so
# none of this package's web dependencies go in.
#
# Nothing here is signed with a certificate: the project has no Apple Developer ID or Windows
# code-signing certificate. macOS Gatekeeper and Windows SmartScreen warn about these builds the
# first time they're opened.
#
# Releases (docs/CONTRIBUTING.md, Desktop releases) attach the installers under fixed names, with
# no version in them, so trioditis.app can link to the latest release's files directly
# (releases/latest/download/<name>). Keep apps/site/index.html in step with these names.
appId: org.trioditis.desktop
productName: Trioditis
executableName: trioditis
copyright: Copyright © Trioditis contributors
directories:
  output: release
  buildResources: build
files:
  - package.json
  - dist-electron/**
  - electron/connect.html
  - electron/connect.css
  - electron/connect.js
  # The window and taskbar icon main.ts loads on Linux and Windows.
  - electron/icon.png
  - '!node_modules/**'
npmRebuild: false
asar: true
# Invitation links (electron/links.ts): declared in the Mac's Info.plist and Linux's .desktop
# file. Windows' installer doesn't register schemes, so the app does as it starts (main.ts).
protocols:
  - name: Trioditis invitation
    schemes:
      - trioditis
publish: null

mac:
  category: public.app-category.social-networking
  target:
    - dmg
    - zip
  artifactName: ${productName}-mac-${arch}.${ext}
  # build/icon.png is the whole tile, for Windows and Linux; a Mac icon has Apple's margin and
  # shadow. Both come from packages/brand/generate.mjs.
  icon: build/icon-mac.png
  # Ad-hoc signed ("-"): there is no Developer ID to sign with, and so no notarizing. Apple
  # silicon refuses to run an app whose signature is broken, which renaming Electron's bundle
  # does, and reports it as damaged; an ad-hoc signature makes it the usual unidentified
  # developer warning instead. The hardened runtime is only for notarized apps, and with an
  # ad-hoc signature it would refuse Electron's own frameworks.
  identity: '-'
  hardenedRuntime: false

# The disk image's window and volume are named for the app alone, not its version and system.
dmg:
  title: Trioditis

win:
  icon: build/icon.png
  target:
    - nsis

nsis:
  artifactName: ${productName}-windows-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Network
  synopsis: Your chat networks in one place
  maintainer: Trioditis contributors
  artifactName: ${productName}-linux-${arch}.${ext}
  # Named here too: without it, Linux falls back to the Mac icon.
  icon: build/icon.png
  target:
    - AppImage
    - deb
  desktop:
    entry:
      StartupWMClass: Trioditis
