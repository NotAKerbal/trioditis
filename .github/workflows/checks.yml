# The checks docs/CONTRIBUTING.md asks for, on every pull request and on pushes to dev and
# main: TypeScript typecheck, lint and tests, release notes, and the bridge host's Go vet and
# tests.
#
# Jobs run only on GitHub's hosted runners. The repository is public, so a pull request from
# a fork runs here too, and a self-hosted runner would hand that code a machine we keep.
name: Checks

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

# A newer commit cancels the older run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base too, for the release note check.
          fetch-depth: 2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:scripts
      - run: node scripts/release-notes.mjs check
      # A pull request's checkout is its merge into the base branch, whose first parent is the
      # base, so the note must be among the changes it brings (docs/CONTRIBUTING.md).
      - name: The pull request adds a release note
        if: github.event_name == 'pull_request'
        run: node scripts/release-notes.mjs added HEAD^1

  go:
    name: Bridge host
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/bridge-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for the Go module
        id: module
        working-directory: .
        run: |
          if [ -f apps/bridge-host/go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.module.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/bridge-host/go.mod
          cache-dependency-path: apps/bridge-host/go.sum
      - if: steps.module.outputs.present == 'true'
        run: go vet ./...
      # Signal's connector is only built with -tags libsignal and libsignal (Rust) to link,
      # which is too slow to build on every run. Vetting needs no library, so this keeps the
      # Signal code compiling; docs/networks/signal.md has the full build.
      - if: steps.module.outputs.present == 'true'
        name: go vet -tags libsignal ./...
        run: go vet -tags libsignal ./...
      # The runner's /usr/bin/chromium is a bare build that aborts at startup because AppArmor
      # blocks its sandbox; Google Chrome's own AppArmor profile lets it sandbox.
      - if: steps.module.outputs.present == 'true'
        run: go test ./...
        env:
          CHROMIUM_PATH: google-chrome
      # The bridge host builds against patched copies of mautrix-signal and mautrix
      # (apps/bridge-host/third_party/README.md); this fails unless each copy is upstream at
      # go.mod's version plus its patch (third_party/<name>.patch), so the patch is the whole change.
      - if: steps.module.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - if: steps.module.outputs.present == 'true'
        name: mautrix-signal and mautrix copies match their patches
        working-directory: .
        run: node scripts/signal-fork.mjs check
