# The checks docs/CONTRIBUTING.md asks for, on every pull request and on pushes to dev and
# main: TypeScript typecheck, lint and tests, and the bridge host's Go vet and tests.
#
# Jobs run on GitHub's ubuntu-24.04 runners unless the repository variable CI_RUNS_ON says
# otherwise, as a JSON runs-on value. '["self-hosted","trioditis"]' sends them to the
# self-hosted runners on Isaac's VM; delete the variable to go back to GitHub's runners.
name: Checks

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

# A newer commit cancels the older run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  go:
    name: Bridge host
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/bridge-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for the Go module
        id: module
        working-directory: .
        run: |
          if [ -f apps/bridge-host/go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.module.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/bridge-host/go.mod
          cache-dependency-path: apps/bridge-host/go.sum
      - if: steps.module.outputs.present == 'true'
        run: go vet ./...
      - if: steps.module.outputs.present == 'true'
        run: go test ./...
